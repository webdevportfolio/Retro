<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Tic Tac Toe — Retro</title>
<link rel="stylesheet" href="tictactoe.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#08080a">
</head>

<body class="ttt-page">

<div class="ttt-app">

<header class="ttt-header">
<a href="games.html" class="ttt-back">←</a>
<div class="ttt-brand">RETRO</div>
<div class="ttt-header-spacer"></div>
</header>

<main class="ttt-main">

<section class="ttt-top">
<div class="ttt-label">TIC TAC TOE</div>
<h1 id="opponent-title">Game</h1>
<p id="turn-text">Your turn</p>
</section>

<section class="ttt-board" id="board">

<button class="ttt-cell" data-index="0"></button>
<button class="ttt-cell" data-index="1"></button>
<button class="ttt-cell" data-index="2"></button>

<button class="ttt-cell" data-index="3"></button>
<button class="ttt-cell" data-index="4"></button>
<button class="ttt-cell" data-index="5"></button>

<button class="ttt-cell" data-index="6"></button>
<button class="ttt-cell" data-index="7"></button>
<button class="ttt-cell" data-index="8"></button>

</section>

<section class="ttt-status">
<div id="game-status">Your turn</div>
<button id="restart-btn">New Game</button>
</section>

</main>

</div>

<script>
const API_BASE_URL='https://retro-backend-hnsv.onrender.com';

const params=new URLSearchParams(window.location.search);
const opponent=params.get('opponent')||'Opponent';
const gameId=params.get('game')||'';

const cells=document.querySelectorAll('.ttt-cell');
const turnText=document.getElementById('turn-text');
const gameStatus=document.getElementById('game-status');
const opponentTitle=document.getElementById('opponent-title');
const restartBtn=document.getElementById('restart-btn');

let activeUser='';
let board=['','','','','','','','',''];
let mySymbol='';
let myTurn=false;
let gameOver=false;
let polling=false;

opponentTitle.textContent=opponent;

window.addEventListener('DOMContentLoaded',async()=>{
const rawUser=localStorage.getItem('username')||localStorage.getItem('retro_session')||'';
activeUser=rawUser.trim().replace('@','');

if(!activeUser){
window.location.href='auth.html';
return;
}

if(!gameId){
gameStatus.textContent='Waiting for game...';
turnText.textContent='Waiting for opponent';
return;
}

await loadGame();

setInterval(loadGame,1500);
});

async function createGame(){
try{
const res=await fetch(`${API_BASE_URL}/api/games/tictactoe`,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
player1:activeUser,
player2:opponent
})
});

const data=await res.json();

if(!res.ok){
gameStatus.textContent=data.error||'Failed to start game.';
return;
}

const game=data.game;

window.history.replaceState({},'',`tictactoe.html?game=${encodeURIComponent(game.game_id)}&opponent=${encodeURIComponent(opponent)}`);

applyGame(game);
}catch(err){
console.error('Create game error:',err);
gameStatus.textContent='Unable to start game.';
}
}

async function loadGame(){
if(!gameId){
const currentUrl=new URL(window.location.href);
gameId=currentUrl.searchParams.get('game')||'';
}

if(!gameId||polling)return;

polling=true;

try{
const res=await fetch(`${API_BASE_URL}/api/games/tictactoe/${encodeURIComponent(gameId)}?t=${Date.now()}`);

if(!res.ok){
polling=false;
return;
}

const data=await res.json();

if(data.game)applyGame(data.game);

}catch(err){
console.error('Load game error:',err);
}

polling=false;
}

function applyGame(game){
board=Array.isArray(game.board)?game.board:['','','','','','','','',''];

mySymbol=game.player1.toLowerCase()===activeUser.toLowerCase()?'X':'O';

myTurn=game.turn.toLowerCase()===activeUser.toLowerCase();

gameOver=game.status!=='playing';

renderBoard();

if(game.status==='finished'){
if(game.winner&&game.winner.toLowerCase()===activeUser.toLowerCase()){
gameStatus.textContent='You win!';
turnText.textContent='You won 🎉';
}else{
gameStatus.textContent=`${opponent} wins!`;
turnText.textContent='Game over';
}
}else if(game.status==='draw'){
gameStatus.textContent='Draw!';
turnText.textContent='Game over';
}else if(myTurn){
turnText.textContent='Your turn';
gameStatus.textContent='Your turn';
}else{
turnText.textContent=`${opponent}'s turn`;
gameStatus.textContent=`${opponent}'s turn`;
}
}

function renderBoard(){
cells.forEach((cell,index)=>{
cell.textContent=board[index]||'';

cell.classList.remove('x','o','winning');

if(board[index]){
cell.classList.add(board[index].toLowerCase());
}
});
}

cells.forEach(cell=>{
cell.addEventListener('click',async()=>{
const index=Number(cell.dataset.index);

if(gameOver||!myTurn||board[index])return;

await makeMove(index);
});
});

async function makeMove(index){
try{
cells[index].disabled=true;

const res=await fetch(`${API_BASE_URL}/api/games/tictactoe/${encodeURIComponent(gameId)}/move`,{
method:'PUT',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
username:activeUser,
index
})
});

const data=await res.json();

if(!res.ok){
console.error(data.error||'Move failed.');
await loadGame();
return;
}

if(data.game){
applyGame(data.game);
}

}catch(err){
console.error('Move error:',err);
}finally{
cells[index].disabled=false;
}
}

restartBtn.addEventListener('click',async()=>{
if(!gameOver)return;

restartBtn.disabled=true;
restartBtn.textContent='Starting...';

try{
const res=await fetch(`${API_BASE_URL}/api/games/tictactoe`,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
player1:activeUser,
player2:opponent
})
});

const data=await res.json();

if(res.ok&&data.game){
gameId=data.game.game_id;

window.history.replaceState({},'',`tictactoe.html?game=${encodeURIComponent(gameId)}&opponent=${encodeURIComponent(opponent)}`);

applyGame(data.game);
}else{
console.error(data.error||'Failed to start rematch.');
}

}catch(err){
console.error('Rematch error:',err);
}

restartBtn.disabled=false;
restartBtn.textContent='New Game';
});
  </script>

</body>
</html>
