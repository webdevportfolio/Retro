<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RETRO | Inbox</title>
  <style>
    :root {
      --bg-color: #08080a;
      --card-bg: #121216;
      --border-color: #22222a;
      --accent-purple: #8b5cf6;
      --accent-hover: #7c3aed;
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.5);
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent-purple);
      text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    h1.page-title {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .search-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .search-row {
      display: flex;
      gap: 0.5rem;
    }

    .search-input {
      flex: 1;
      background: #09090c;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      letter-spacing: 1px;
      outline: none;
    }

    .search-btn {
      background: var(--accent-purple);
      border: none;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: var(--error-color);
      font-size: 0.8rem;
      display: none;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-sub);
    }

    .create-group-btn {
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 20px;
    }

    .chat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.8rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      cursor: pointer;
    }

    .inbox-card-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .inbox-card-content {
      flex: 1;
      overflow: hidden;
    }

    .inbox-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .inbox-card-username {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .inbox-card-preview {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .empty-notice {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-style: italic;
      padding: 0.2rem 0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo">RETRO</div>
      <div class="header-actions">
        <button id="profile-btn" class="btn-secondary">User</button>
        <button onclick="logout()" class="btn-secondary">Logout</button>
      </div>
    </header>

    <h1 class="page-title">Inbox</h1>

    <div class="search-card">
      <div class="search-row">
        <input type="text" id="join-code-input" class="search-input" placeholder="ENTER CHAT CODE..." />
        <button id="join-code-btn" class="search-btn">Search</button>
      </div>
      <div id="code-error" class="error-msg"></div>
    </div>

    <section>
      <div class="section-header">
        <span class="section-title">GROUP CHATS</span>
        <button id="open-create-group-btn" class="create-group-btn">+ Create Group</button>
      </div>
      <div id="group-list" class="chat-list">
        <div class="empty-notice">No group chats yet.</div>
      </div>
    </section>

    <section>
      <div class="section-header">
        <span class="section-title">DIRECT MESSAGES</span>
      </div>
      <div id="inbox-list" class="chat-list">
        <div class="empty-notice">No direct messages yet.</div>
      </div>
    </section>
  </div>

  <script>
    const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';
    let activeUser = '';
    let knownDmContacts = new Set();

    function logout() {
      localStorage.removeItem('username');
      localStorage.removeItem('retro_session');
      window.location.href = 'auth.html';
    }

    function cleanPreviewText(text) {
      if (!text) return '';
      let clean = text;
      if (clean.startsWith('[reply:')) {
        const splitIdx = clean.indexOf(']');
        if (splitIdx !== -1) clean = clean.substring(splitIdx + 1).trim();
      }
      if (clean.startsWith('[img]')) return '📷 Photo';
      if (clean.startsWith('[sticker]')) return '🎨 Sticker';
      if (clean.startsWith('[audio]')) return '🎙️ Voice note';
      return clean;
    }

    // Helper for Render backend spin-up delay
    async function fetchWithRetry(url, options = {}, retries = 2, delayMs = 1500) {
      for (let i = 0; i <= retries; i++) {
        try {
          const res = await fetch(url, options);
          if (res.ok) return res;
        } catch (err) {
          if (i === retries) throw err;
        }
        await new Promise(r => setTimeout(r, delayMs));
      }
      throw new Error('Fetch failed after retries');
    }

    function getChatCode(user) {
      let hash = 0;
      const str = user.toLowerCase() + "_retro_secret_salt";
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      const cleanHash = Math.abs(hash).toString(36).toUpperCase().substring(0, 5);
      return `RETRO-${cleanHash}`;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const rawActive = localStorage.getItem('username') || localStorage.getItem('retro_session') || '';
      activeUser = rawActive.trim().replace('@', '');

      if (!activeUser) {
        window.location.href = 'auth.html';
        return;
      }

      const profileBtn = document.getElementById('profile-btn');
      if (profileBtn) profileBtn.textContent = activeUser;

      const joinCodeInput = document.getElementById('join-code-input');
      const joinCodeBtn = document.getElementById('join-code-btn');
      const codeError = document.getElementById('code-error');

      async function handleCodeJoin() {
        const inputCode = joinCodeInput.value.trim().toUpperCase();
        if (!inputCode) return;

        joinCodeBtn.disabled = true;
        joinCodeBtn.textContent = 'Searching...';
        codeError.style.display = 'none';

        try {
          const res = await fetchWithRetry(`${API_BASE_URL}/api/users`);
          const users = await res.json();

          const matchedUser = users.find(u => {
            const username = (typeof u === 'string' ? u : u.username || u.name || '').trim().replace('@', '');
            return getChatCode(username) === inputCode;
          });

          if (matchedUser) {
            const targetUsername = typeof matchedUser === 'string' ? matchedUser : (matchedUser.username || matchedUser.name);

            if (targetUsername.toLowerCase() === activeUser.toLowerCase()) {
              codeError.textContent = 'You cannot chat with yourself!';
              codeError.style.display = 'block';
              joinCodeBtn.disabled = false;
              joinCodeBtn.textContent = 'Search';
              return;
            }

            window.location.href = `chat.html?user=${encodeURIComponent(targetUsername)}`;
          } else {
            codeError.textContent = 'Invalid Chat Code. Please check and try again.';
            codeError.style.display = 'block';
            joinCodeBtn.disabled = false;
            joinCodeBtn.textContent = 'Search';
          }
        } catch (err) {
          console.error('Error resolving code:', err);
          codeError.textContent = 'Server connecting... Please try clicking Search again in a few seconds.';
          codeError.style.display = 'block';
          joinCodeBtn.disabled = false;
          joinCodeBtn.textContent = 'Search';
        }
      }

      if (joinCodeBtn) joinCodeBtn.addEventListener('click', handleCodeJoin);
      if (joinCodeInput) {
        joinCodeInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') handleCodeJoin();
        });
      }

      loadInbox();
      loadUserGroups();
      setInterval(() => {
        loadInbox();
        loadUserGroups();
      }, 5000);
    });

    async function loadInbox() {
      const lowerActive = activeUser.toLowerCase();
      if (!activeUser) return;

      const inboxList = document.getElementById('inbox-list');
      if (!inboxList) return;

      try {
        let userAvatars = {};
        try {
          const usersRes = await fetch(`${API_BASE_URL}/api/users`);
          if (usersRes.ok) {
            const usersList = await usersRes.json();
            usersList.forEach(u => {
              if (typeof u === 'object') {
                const uname = (u.username || u.name || '').trim().replace('@', '').toLowerCase();
                const pfp = u.pfp || u.avatar || u.profile_picture || u.profilePic || u.image;
                if (uname && pfp) userAvatars[uname] = pfp;
              }
            });
          }
        } catch (uErr) {
          console.error('Error loading user avatars:', uErr);
        }

        let response = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}`);
        if (!response.ok) {
          response = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(lowerActive)}`);
        }

        if (!response.ok) {
          inboxList.innerHTML = '<div class="empty-notice">No direct messages yet.</div>';
          return;
        }

        let messages = await response.json();

        if (!messages || !Array.isArray(messages) || messages.length === 0) {
          inboxList.innerHTML = '<div class="empty-notice">No direct messages yet.</div>';
          return;
        }

        const conversationMap = {};

        messages.forEach(msg => {
          const senderRaw = msg.sender_username || msg.sender || '';
          const receiverRaw = msg.receiver_username || msg.receiver || '';

          const sender = senderRaw.trim().replace('@', '').toLowerCase();
          const receiver = receiverRaw.trim().replace('@', '').toLowerCase();

          let otherUserDisplay = '';
          if (sender === lowerActive) {
            otherUserDisplay = receiverRaw.trim().replace('@', '');
          } else if (receiver === lowerActive) {
            otherUserDisplay = senderRaw.trim().replace('@', '');
          }

          if (!otherUserDisplay || otherUserDisplay.toLowerCase() === lowerActive) return;

          knownDmContacts.add(otherUserDisplay);

          const mapKey = otherUserDisplay.toLowerCase();
          const msgDate = new Date(msg.created_at || msg.timestamp || Date.now());

          if (!conversationMap[mapKey] || msgDate >= new Date(conversationMap[mapKey].created_at)) {
            conversationMap[mapKey] = {
              username: otherUserDisplay,
              sender: sender,
              content: msg.content || '',
              created_at: msgDate
            };
          }
        });

        const conversations = Object.values(conversationMap).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        if (conversations.length === 0) {
          inboxList.innerHTML = '<div class="empty-notice">No direct messages yet.</div>';
          return;
        }

        inboxList.innerHTML = conversations.map(conv => {
          const unameLower = conv.username.toLowerCase();
          const avatarPfp = userAvatars[unameLower];

          return `
            <div class="chat-card" onclick="window.location.href='chat.html?user=${encodeURIComponent(conv.username)}'">
              <div class="inbox-card-avatar">
                ${avatarPfp 
                  ? `<img src="${avatarPfp}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">` 
                  : `<span>${conv.username.charAt(0).toUpperCase()}</span>`
                }
              </div>
              <div class="inbox-card-content">
                <div class="inbox-card-header">
                  <div class="inbox-card-username">${conv.username}</div>
                </div>
                <div class="inbox-card-preview">${cleanPreviewText(conv.content)}</div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Failed to load inbox:', err);
        inboxList.innerHTML = '<div class="empty-notice">No direct messages yet.</div>';
      }
    }

    async function loadUserGroups() {
      if (!activeUser) return;
      const groupListContainer = document.getElementById('group-list');
      if (!groupListContainer) return;

      try {
        const res = await fetch(`${API_BASE_URL}/api/groups/user/${encodeURIComponent(activeUser)}`);
        if (!res.ok) {
          groupListContainer.innerHTML = '<div class="empty-notice">No group chats yet.</div>';
          return;
        }
        
        const data = await res.json();
        const groups = Array.isArray(data) ? data : (data.groups || []);

        if (!groups || groups.length === 0) {
          groupListContainer.innerHTML = '<div class="empty-notice">No group chats yet.</div>';
          return;
        }

        groupListContainer.innerHTML = groups.map(g => `
          <div class="chat-card" onclick="window.location.href='groupchat.html?groupId=${g.id}'">
            <div class="inbox-card-avatar">
              ${g.avatar 
                ? `<img src="${g.avatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">` 
                : `<span>${g.name.charAt(0).toUpperCase()}</span>`
              }
            </div>
            <div class="inbox-card-content">
              <div class="inbox-card-header">
                <div class="inbox-card-username">${g.name}</div>
              </div>
              <div class="inbox-card-preview">Tap to enter group chat</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load user groups:', err);
        groupListContainer.innerHTML = '<div class="empty-notice">No group chats yet.</div>';
      }
    }
  </script>
</body>
</html>
