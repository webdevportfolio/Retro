<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RETRO | Inbox</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-color: #08080a;
      --card-bg: #121216;
      --card-border: #22222a;
      --accent-purple: #8b5cf6;
      --accent-hover: #7c3aed;
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.4);
      --error-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .inbox-app-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .inbox-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.5rem;
    }

    .inbox-brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent-purple);
      text-shadow: 0 0 12px rgba(139, 92, 246, 0.35);
    }

    .inbox-header-actions {
      display: flex;
      gap: 0.5rem;
    }

    .inbox-user-pill, .inbox-logout-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .inbox-title {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .code-search-box {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .code-input-wrapper {
      display: flex;
      gap: 0.5rem;
    }

    #join-code-input {
      flex: 1;
      background: #09090c;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      outline: none;
    }

    #join-code-btn {
      background: var(--accent-purple);
      border: none;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    #join-code-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .code-error-msg {
      color: var(--error-red);
      font-size: 0.8rem;
      display: none;
    }

    .inbox-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .inbox-section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-sub);
    }

    .create-group-trigger {
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Demure Empty State Styling */
    .empty-state {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-style: italic;
      padding: 0.3rem 0;
      letter-spacing: 0.2px;
    }

    .chat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.8rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      cursor: pointer;
    }

    .inbox-card-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .inbox-card-content {
      flex: 1;
      overflow: hidden;
    }

    .inbox-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .inbox-card-username {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .inbox-card-preview {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Modal Overlay Styles */
    .retro-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .retro-modal-overlay.active {
      display: flex;
    }

    .retro-modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .retro-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .retro-modal-close {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-input {
      background: #09090c;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }

    .modal-submit-btn {
      background: var(--accent-purple);
      border: none;
      color: #fff;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .avatar-picker-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .avatar-picker-label {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #09090c;
      border: 1px dashed var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .avatar-picker-hint {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .modal-error-box {
      color: var(--error-red);
      font-size: 0.8rem;
    }

    .contacts-checklist {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .avatar-view-content img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 12px;
    }
  </style>
</head>
<body class="inbox-page">

  <div class="inbox-app-wrapper">
    <header class="inbox-header">
      <div class="inbox-brand">RETRO</div>
      <div class="inbox-header-actions">
        <button id="profile-btn" class="inbox-user-pill">User</button>
        <button onclick="logout()" class="inbox-logout-btn">Logout</button>
      </div>
    </header>

    <h1 class="inbox-title">Inbox</h1>

    <div class="code-search-box">
      <div class="code-input-wrapper">
        <input type="text" id="join-code-input" placeholder="ENTER CHAT CODE..." />
        <button id="join-code-btn">Search</button>
      </div>
      <div id="code-error" class="code-error-msg"></div>
    </div>

    <div class="inbox-section">
      <div class="inbox-section-title">
        <span>GROUP CHATS</span>
        <button id="open-create-group-btn" class="create-group-trigger">+ Create Group</button>
      </div>
      <div id="group-list">
        <div class="empty-state">No group chats yet.</div>
      </div>
    </div>

    <div class="inbox-section">
      <div class="inbox-section-title">
        <span>DIRECT MESSAGES</span>
      </div>
      <div id="inbox-list">
        <div class="empty-state">No direct messages yet.</div>
      </div>
    </div>
  </div>

  <!-- CREATE GROUP MODAL -->
  <div id="create-group-modal" class="retro-modal-overlay">
    <div class="retro-modal-content">
      <div class="retro-modal-header">
        <h3>Create Group Chat</h3>
        <button class="retro-modal-close" onclick="closeCreateGroupModal()">&times;</button>
      </div>
      <div class="retro-modal-body">
        <div id="group-modal-error" class="modal-error-box" style="display:none;"></div>
        
        <div class="avatar-picker-wrapper">
          <label for="group-avatar-input" class="avatar-picker-label">
            <span id="avatar-picker-icon">📷</span>
            <img id="avatar-preview-img" style="display:none; width:100%; height:100%; object-fit:cover;" />
          </label>
          <input type="file" id="group-avatar-input" accept="image/*" style="display:none;" onchange="previewGroupAvatar(event)" />
          <span class="avatar-picker-hint">Set Group Photo</span>
        </div>

        <input type="text" id="group-name-input" class="modal-input" placeholder="Group Name..." style="margin-top: 10px;" />

        <div class="select-members-label" style="font-size:0.8rem; color:var(--text-sub); margin: 10px 0 5px 0;">Select Members from DMs:</div>
        <div id="dm-contacts-checklist" class="contacts-checklist"></div>

        <button id="submit-create-group-btn" class="modal-submit-btn" style="margin-top: 10px;">Create Group</button>
      </div>
    </div>
  </div>

  <!-- AVATAR MODAL -->
  <div id="avatar-modal" class="retro-modal-overlay" onclick="closeAvatarModal()">
    <div class="retro-modal-content avatar-view-content" onclick="event.stopPropagation()">
      <img id="modal-avatar-img" src="" alt="Avatar" />
    </div>
  </div>

  <!-- NOTIFICATION MODAL -->
  <div id="notif-modal" class="retro-modal-overlay">
    <div class="retro-modal-content">
      <h3>Enable Notifications</h3>
      <p style="font-size: 0.85rem; color: var(--text-sub);">
        Get notified instantly when someone messages you on RETRO.
      </p>
      <div style="display: flex; gap: 10px;">
        <button onclick="handleEnableNotifsClick()" class="modal-submit-btn">Enable</button>
        <button onclick="dismissNotifModal()" class="inbox-user-pill" style="flex: 1;">Dismiss</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';
    let activeUser = '';
    let knownDmContacts = new Set();

    function logout() {
      localStorage.removeItem('username');
      localStorage.removeItem('retro_session');
      window.location.href = 'auth.html';
    }

    function cleanPreviewText(text) {
      if (!text) return '';
      let clean = text;
      if (clean.startsWith('[reply:')) {
        const splitIdx = clean.indexOf(']');
        if (splitIdx !== -1) clean = clean.substring(splitIdx + 1).trim();
      }
      if (clean.startsWith('[img]')) return '📷 Photo';
      if (clean.startsWith('[sticker]')) return '🎨 Sticker';
      if (clean.startsWith('[audio]')) return '🎙️ Voice note';
      return clean;
    }

    async function fetchWithRetry(url, options = {}, retries = 2, delay = 1500) {
      for (let i = 0; i <= retries; i++) {
        try {
          const res = await fetch(url, options);
          if (res.ok) return res;
        } catch (err) {
          if (i === retries) throw err;
        }
        await new Promise(res => setTimeout(res, delay));
      }
      throw new Error('Network request failed');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const rawActive = localStorage.getItem('username') || localStorage.getItem('retro_session') || '';
      activeUser = rawActive.trim().replace('@', '');

      if (!activeUser) {
        window.location.href = 'auth.html';
        return;
      }

      const profileBtn = document.getElementById('profile-btn');
      if (profileBtn) {
        profileBtn.textContent = activeUser;
        profileBtn.addEventListener('click', () => {
          window.location.href = 'profile.html';
        });
      }

      const joinCodeInput = document.getElementById('join-code-input');
      const joinCodeBtn = document.getElementById('join-code-btn');
      const codeError = document.getElementById('code-error');

      async function handleCodeJoin() {
        const inputCode = joinCodeInput.value.trim().toUpperCase();
        if (!inputCode) return;

        joinCodeBtn.disabled = true;
        joinCodeBtn.textContent = 'Searching...';
        if (codeError) codeError.style.display = 'none';

        try {
          const res = await fetchWithRetry(`${API_BASE_URL}/api/users`);
          const users = await res.json();

          const matchedUser = users.find(u => {
            const username = (typeof u === 'string' ? u : u.username || u.name || '').trim().replace('@', '');
            return getChatCode(username) === inputCode;
          });

          if (matchedUser) {
            const targetUsername = typeof matchedUser === 'string' ? matchedUser : (matchedUser.username || matchedUser.name);

            if (targetUsername.toLowerCase() === activeUser.toLowerCase()) {
              if (codeError) {
                codeError.textContent = 'You cannot chat with yourself!';
                codeError.style.display = 'block';
              }
              joinCodeBtn.disabled = false;
              joinCodeBtn.textContent = 'Search';
              return;
            }

            window.location.href = `chat.html?user=${encodeURIComponent(targetUsername)}`;
          } else {
            if (codeError) {
              codeError.textContent = 'Invalid Chat Code. Please check and try again.';
              codeError.style.display = 'block';
            }
            joinCodeBtn.disabled = false;
            joinCodeBtn.textContent = 'Search';
          }
        } catch (err) {
          console.error('Error resolving code:', err);
          if (codeError) {
            codeError.textContent = 'Server connecting... Try clicking Search again in a few seconds.';
            codeError.style.display = 'block';
          }
          joinCodeBtn.disabled = false;
          joinCodeBtn.textContent = 'Search';
        }
      }

      function getChatCode(user) {
        let hash = 0;
        const str = user.toLowerCase() + "_retro_secret_salt";
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        const cleanHash = Math.abs(hash).toString(36).toUpperCase().substring(0, 5);
        return `RETRO-${cleanHash}`;
      }

      if (joinCodeBtn) joinCodeBtn.addEventListener('click', handleCodeJoin);
      if (joinCodeInput) {
        joinCodeInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') handleCodeJoin();
        });
      }

      const openGroupBtn = document.getElementById('open-create-group-btn');
      const submitGroupBtn = document.getElementById('submit-create-group-btn');

      if (openGroupBtn) openGroupBtn.addEventListener('click', openCreateGroupModal);
      if (submitGroupBtn) submitGroupBtn.addEventListener('click', handleCreateGroupSubmit);

      loadInbox();
      loadUserGroups();
      setInterval(() => {
        loadInbox();
        loadUserGroups();
      }, 4000);
    });

    function dismissNotifModal() {
      const modal = document.getElementById('notif-modal');
      if (modal) modal.classList.remove('active');
    }

    function openCreateGroupModal() {
      hideGroupModalError();
      const modal = document.getElementById('create-group-modal');
      const contactsContainer = document.getElementById('dm-contacts-checklist');
      if (!modal) return;
      
      const sortedContacts = Array.from(knownDmContacts).sort((a, b) => a.localeCompare(b));

      if (contactsContainer) {
        if (sortedContacts.length === 0) {
          contactsContainer.innerHTML = '<div class="empty-state">No DM contacts available</div>';
        } else {
          contactsContainer.innerHTML = sortedContacts.map(contact => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:0.3rem 0;">
              <span style="font-size:0.85rem; font-weight:600;">@${contact}</span>
              <input type="checkbox" value="${contact}" class="group-member-checkbox">
            </div>
          `).join('');
        }
      }

      modal.classList.add('active');
    }

    function closeCreateGroupModal() {
      const modal = document.getElementById('create-group-modal');
      if (modal) modal.classList.remove('active');
      
      const nameInput = document.getElementById('group-name-input');
      const fileInput = document.getElementById('group-avatar-input');
      if (nameInput) nameInput.value = '';
      if (fileInput) fileInput.value = '';
      hideGroupModalError();
      
      const previewImg = document.getElementById('avatar-preview-img');
      const icon = document.getElementById('avatar-picker-icon');
      if (previewImg) {
        previewImg.src = '';
        previewImg.style.display = 'none';
      }
      if (icon) icon.style.display = 'inline';
    }

    function showGroupModalError(msg) {
      const errBox = document.getElementById('group-modal-error');
      if (errBox) {
        errBox.textContent = msg;
        errBox.style.display = 'block';
      }
    }

    function hideGroupModalError() {
      const errBox = document.getElementById('group-modal-error');
      if (errBox) {
        errBox.style.display = 'none';
        errBox.textContent = '';
      }
    }

    function previewGroupAvatar(event) {
      const file = event.target.files[0];
      const previewImg = document.getElementById('avatar-preview-img');
      const icon = document.getElementById('avatar-picker-icon');

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          if (previewImg) {
            previewImg.src = e.target.result;
            previewImg.style.display = 'block';
          }
          if (icon) icon.style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    }

    async function handleCreateGroupSubmit() {
      hideGroupModalError();
      const nameInput = document.getElementById('group-name-input');
      const fileInput = document.getElementById('group-avatar-input');
      const submitBtn = document.getElementById('submit-create-group-btn');

      if (!nameInput) return;
      const groupName = nameInput.value.trim();
      if (!groupName) {
        showGroupModalError('Please enter a group name.');
        return;
      }

      const checkedMembers = Array.from(document.querySelectorAll('.group-member-checkbox:checked')).map(cb => cb.value);

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating...';
      }

      let avatarBase64 = null;
      if (fileInput && fileInput.files[0]) {
        avatarBase64 = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.readAsDataURL(fileInput.files[0]);
        });
      }

      try {
        const res = await fetch(`${API_BASE_URL}/api/groups`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: groupName,
            avatar: avatarBase64,
            created_by: activeUser,
            members: checkedMembers || []
          })
        });

        const data = await res.json();
        if (res.ok && data.group) {
          closeCreateGroupModal();
          window.location.href = `groupchat.html?groupId=${data.group.id}`;
        } else {
          showGroupModalError(data.error || 'Failed to create group.');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Group';
          }
        }
      } catch (err) {
        console.error('Error creating group:', err);
        showGroupModalError('Network error while creating group.');
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Group';
        }
      }
    }

    async function loadUserGroups() {
      if (!activeUser) return;
      const groupListContainer = document.getElementById('group-list');
      if (!groupListContainer) return;

      try {
        const res = await fetch(`${API_BASE_URL}/api/groups/user/${encodeURIComponent(activeUser)}`);
        if (!res.ok) {
          groupListContainer.innerHTML = '<div class="empty-state">No group chats yet.</div>';
          return;
        }
        const data = await res.json();
        const groups = Array.isArray(data) ? data : (data.groups || []);

        if (!groups || groups.length === 0) {
          groupListContainer.innerHTML = '<div class="empty-state">No group chats yet.</div>';
          return;
        }

        groupListContainer.innerHTML = groups.map(g => `
          <div class="chat-card" onclick="window.location.href='groupchat.html?groupId=${g.id}'">
            <div class="inbox-card-avatar">
              ${g.avatar 
                ? `<img src="${g.avatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">` 
                : `<span>${g.name.charAt(0).toUpperCase()}</span>`
              }
            </div>
            <div class="inbox-card-content">
              <div class="inbox-card-header">
                <div class="inbox-card-username">${g.name}</div>
              </div>
              <div class="inbox-card-preview">Tap to enter group chat</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load user groups:', err);
        groupListContainer.innerHTML = '<div class="empty-state">No group chats yet.</div>';
      }
    }

    async function loadInbox() {
      const lowerActive = activeUser.toLowerCase();
      if (!activeUser) return;

      const inboxList = document.getElementById('inbox-list');
      const emptyNoticeHtml = '<div class="empty-state">No direct messages yet.</div>';
      if (!inboxList) return;

      try {
        let response = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}`);
        if (!response.ok) return;
        
        let messages = await response.json();

        if (!messages || messages.length === 0) {
          inboxList.innerHTML = emptyNoticeHtml;
          return;
        }

        const conversationMap = {};
        
        messages.forEach(msg => {
          const senderRaw = msg.sender_username || msg.sender || '';
          const receiverRaw = msg.receiver_username || msg.receiver || '';
          
          const sender = senderRaw.trim().replace('@', '').toLowerCase();
          const receiver = receiverRaw.trim().replace('@', '').toLowerCase();
          
          let otherUserDisplay = '';
          if (sender === lowerActive) {
            otherUserDisplay = receiverRaw.trim().replace('@', '');
          } else if (receiver === lowerActive) {
            otherUserDisplay = senderRaw.trim().replace('@', '');
          }

          if (!otherUserDisplay || otherUserDisplay.toLowerCase() === lowerActive) return;

          knownDmContacts.add(otherUserDisplay);

          const mapKey = otherUserDisplay.toLowerCase();
          const msgDate = new Date(msg.created_at || msg.timestamp || Date.now());

          if (!conversationMap[mapKey] || msgDate >= new Date(conversationMap[mapKey].created_at)) {
            conversationMap[mapKey] = {
              username: otherUserDisplay,
              sender: sender,
              content: msg.content || '',
              created_at: msgDate
            };
          }
        });

        const conversations = Object.values(conversationMap).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        if (conversations.length === 0) {
          inboxList.innerHTML = emptyNoticeHtml;
          return;
        }

        inboxList.innerHTML = conversations.map(conv => `
          <div class="chat-card" onclick="window.location.href='chat.html?user=${encodeURIComponent(conv.username)}'">
            <div class="inbox-card-avatar">
              <span>${conv.username.charAt(0).toUpperCase()}</span>
            </div>
            <div class="inbox-card-content">
              <div class="inbox-card-header">
                <div class="inbox-card-username">${conv.username}</div>
              </div>
              <div class="inbox-card-preview">${cleanPreviewText(conv.content)}</div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error('Failed to load inbox:', err);
        inboxList.innerHTML = emptyNoticeHtml;
      }
    }
  </script>
</body>
</html>
