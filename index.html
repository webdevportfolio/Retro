<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#000000">
</head>
<body class="inbox-body">

  <!-- Top Navigation Bar -->
  <header class="nav-bar">
    <a href="index.html" class="logo-glow">RETRO</a>
    <div>
      <a href="profile.html" id="profile-btn" class="nav-btn">User</a>
      <button class="nav-btn" onclick="logout()" style="margin-left: 6px;">Logout</button>
    </div>
  </header>

  <!-- Main Feed -->
  <main class="main-container">
    <div class="inbox-header">
      <h2>Inbox</h2>
    </div>

    <!-- Container for active chats -->
    <div id="inbox-list" class="chat-list"></div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-title">No Active Messages</div>
      <div class="empty-sub">Share your profile link to receive messages.</div>
    </div>
  </main>

  <script>
    const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';
    let lastKnownMsgCount = 0;

    window.addEventListener('DOMContentLoaded', () => {
      // Request Notification Permission
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      const urlParams = new URLSearchParams(window.location.search);
      const targetUser = urlParams.get('u') || urlParams.get('user') || urlParams.get('username');

      if (targetUser) {
        localStorage.setItem('pendingChatUser', targetUser.trim().replace('@', ''));
      }

      const rawActive = localStorage.getItem('username') || localStorage.getItem('retro_session') || '';
      const activeUser = rawActive.trim().replace('@', '');

      if (!activeUser) {
        window.location.href = 'auth.html';
        return;
      }

      const profileBtn = document.getElementById('profile-btn');
      if (profileBtn) {
        profileBtn.textContent = activeUser;
      }

      const pendingUser = localStorage.getItem('pendingChatUser');
      if (pendingUser && pendingUser.toLowerCase() !== activeUser.toLowerCase()) {
        localStorage.removeItem('pendingChatUser');
        window.location.href = `chat.html?user=${encodeURIComponent(pendingUser)}`;
        return;
      }

      loadInbox();
      setInterval(loadInbox, 4000);
    });

    function logout() {
      localStorage.removeItem('username');
      localStorage.removeItem('retro_session');
      window.location.href = 'auth.html';
    }

    function openChat(username, timestamp) {
      localStorage.setItem(`read_${username.toLowerCase()}`, timestamp);
      window.location.href = `chat.html?user=${encodeURIComponent(username)}`;
    }

    async function loadInbox() {
      const rawActive = localStorage.getItem('username') || localStorage.getItem('retro_session') || '';
      const activeUser = rawActive.trim().replace('@', '');
      const lowerActive = activeUser.toLowerCase();
      
      if (!activeUser) return;

      try {
        let response = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}`);
        if (!response.ok) return;
        
        let messages = await response.json();

        if ((!messages || messages.length === 0) && activeUser !== lowerActive) {
          const fallbackRes = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(lowerActive)}`);
          if (fallbackRes.ok) {
            messages = await fallbackRes.json();
          }
        }

        const inboxList = document.getElementById('inbox-list');
        const emptyState = document.getElementById('empty-state');
        
        if (!inboxList) return;

        if (!messages || messages.length === 0) {
          inboxList.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          return;
        }

        // Trigger notification if new message arrives and page is hidden
        if (messages.length > lastKnownMsgCount && lastKnownMsgCount !== 0) {
          const newest = messages[messages.length - 1];
          const sender = (newest.sender_username || newest.sender || '').trim().replace('@', '');
          
          if (sender.toLowerCase() !== lowerActive && 'Notification' in window && Notification.permission === 'granted') {
            if (document.hidden) {
              new Notification(`New message from ${sender}`, {
                body: newest.content || 'Sent a message',
                icon: 'icon.png'
              });
            }
          }
        }
        lastKnownMsgCount = messages.length;

        const conversationMap = {};
        
        messages.forEach(msg => {
          const senderRaw = msg.sender_username || msg.sender || '';
          const receiverRaw = msg.receiver_username || msg.receiver || '';
          
          const sender = senderRaw.trim().replace('@', '').toLowerCase();
          const receiver = receiverRaw.trim().replace('@', '').toLowerCase();
          
          let otherUserDisplay = '';
          if (sender === lowerActive) {
            otherUserDisplay = receiverRaw.trim().replace('@', '');
          } else if (receiver === lowerActive) {
            otherUserDisplay = senderRaw.trim().replace('@', '');
          }

          if (!otherUserDisplay || otherUserDisplay.toLowerCase() === lowerActive) return;

          const mapKey = otherUserDisplay.toLowerCase();
          const msgDate = new Date(msg.created_at || msg.timestamp || Date.now());

          if (!conversationMap[mapKey] || msgDate > new Date(conversationMap[mapKey].created_at)) {
            conversationMap[mapKey] = {
              username: otherUserDisplay,
              sender: sender,
              content: msg.content || '',
              created_at: msgDate
            };
          }
        });

        const conversations = Object.values(conversationMap).sort((a, b) => {
          return new Date(b.created_at) - new Date(a.created_at);
        });

        if (conversations.length === 0) {
          inboxList.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          return;
        }
// Function to update the home screen app icon badge
function updateHomeScreenBadge(count) {
  if ('setAppBadge' in navigator) {
    if (count > 0) {
      navigator.setAppBadge(count).catch((err) => console.error('Badge error:', err));
    } else {
      navigator.clearAppBadge().catch((err) => console.error('Badge error:', err));
    }
  }
}

if (totalUnread > 0) {
  document.title = `(${totalUnread}) RETRO | Inbox`;
  updateHomeScreenBadge(totalUnread); // Updates 1, 2, 3 on app icon
} else {
  document.title = 'RETRO | Inbox';
  updateHomeScreenBadge(0); // Clears icon badge when read
}

        if (emptyState) emptyState.style.display = 'none';

        inboxList.innerHTML = conversations.map(conv => {
          const time = new Date(conv.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          const lastReadMsgTime = localStorage.getItem(`read_${conv.username.toLowerCase()}`);
          const isUnread = conv.sender.toLowerCase() !== lowerActive && 
                           (!lastReadMsgTime || new Date(conv.created_at) > new Date(lastReadMsgTime));

          const cardClass = isUnread ? 'chat-card unread' : 'chat-card';

          return `
            <div class="${cardClass}" onclick="openChat('${conv.username}', '${conv.created_at.toISOString()}')">
              <div class="inbox-card-username">${conv.username}</div>
              <div class="inbox-card-preview">${conv.content}</div>
              <div class="inbox-card-time">${time}</div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Failed to load inbox:', err);
      }
    }
  </script>
</body>
</html>
