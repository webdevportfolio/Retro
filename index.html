<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#000000">
  <style>
    .inbox-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .unread-badge {
      background: #a855f7;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
    }
    .avatar-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: flex-start;
      align-items: center;
      flex-direction: column;
      padding-top: 18vh;
    }
    .avatar-modal.active { display: flex; }

    .avatar-modal img {
      width: 260px;
      height: 260px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Group Section Headers & Badges */
    .section-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .create-group-btn {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #a855f7;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .create-group-btn:hover {
      background: rgba(168, 85, 247, 0.3);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .contact-select-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      margin-bottom: 6px;
    }

    /* Custom Avatar Picker Circle */
    .group-avatar-picker {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(168, 85, 247, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: 0 auto 16px auto;
      overflow: hidden;
      position: relative;
      transition: all 0.2s ease;
    }
    .group-avatar-picker:hover {
      border-color: #a855f7;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }
    .group-avatar-picker img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .group-avatar-picker span {
      font-size: 1.2rem;
      color: #a855f7;
    }

    /* Empty Contacts Demure State */
    .empty-contacts-notice {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.35);
      padding: 10px 0;
      font-style: italic;
      letter-spacing: 0.2px;
    }

    /* In-Modal Feedback Message */
    .modal-error-msg {
      display: none;
      color: #ff5555;
      font-size: 0.78rem;
      margin-top: 10px;
      text-align: center;
      background: rgba(255, 85, 85, 0.1);
      border: 1px solid rgba(255, 85, 85, 0.25);
      padding: 6px 10px;
      border-radius: 6px;
    }

    /* Modal Button Styles */
    .modal-btn-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .modal-btn-cancel {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .modal-btn-cancel:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .modal-btn-submit {
      flex: 1;
      padding: 12px;
      margin-top: 0;
    }
  </style>
  <meta property="og:title" content="RETRO">
  <meta property="og:description" content="Chat freely and securely.">
  <meta property="og:image" content="https://webdevportfolio.github.io/Retro/icon.png">
  <meta property="og:url" content="https://webdevportfolio.github.io/Retro/index.html">
  <meta property="og:type" content="website">
</head>
<body class="inbox-body">

  <!-- Top Navigation Bar -->
  <header class="nav-bar">
    <a href="index.html" class="logo-glow">RETRO</a>
    <div>
      <a href="profile.html" id="profile-btn" class="nav-btn">User</a>
      <button class="nav-btn" onclick="logout()" style="margin-left: 6px;">Logout</button>
    </div>
  </header>

  <!-- Main Feed -->
  <main class="main-container">
    <div class="inbox-header">
      <h2>Inbox</h2>
    </div>

    <!-- Enter Private Chat Code Section -->
    <div class="code-entry-card">
      <div class="code-input-wrapper">
        <input type="text" id="join-code-input" class="input-field code-join-field" placeholder="Enter Chat Code...">
        <button id="join-code-btn" class="auth-btn join-btn">Search</button>
      </div>
      <div id="code-error" class="code-error-msg"></div>
    </div>

    <!-- Group Chats Section -->
    <div style="margin-bottom: 24px;">
      <div class="section-title-bar">
        <div style="font-size: 0.75rem; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 700;">Group Chats</div>
        <button id="open-create-group-btn" class="create-group-btn">+ Create Group</button>
      </div>
      <div id="group-list" class="chat-list"></div>
    </div>

    <!-- Container for Direct Messages -->
    <div>
      <div class="section-title-bar">
        <div style="font-size: 0.75rem; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 700;">Direct Messages</div>
      </div>
      <div id="inbox-list" class="chat-list"></div>
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-title">No Active Messages.</div>
      <div class="empty-sub">Enter a friend's Chat Code above to start messaging privately.</div>
    </div>
  </main>

  <!-- Create Group Modal -->
  <div class="modal-overlay" id="create-group-modal">
    <div class="modal-box" style="text-align: left; max-width: 380px;">
      <h3 style="font-weight: 800; font-size: 1.1rem; margin-bottom: 16px; text-align: center;">New Group Chat</h3>
      
      <!-- Circular Avatar Selector -->
      <div class="group-avatar-picker" onclick="document.getElementById('group-avatar-input').click()">
        <span id="avatar-picker-icon">+</span>
        <img id="avatar-preview-img" alt="Avatar Preview">
      </div>
      <input type="file" id="group-avatar-input" accept="image/*" style="display: none;" onchange="previewGroupAvatar(event)">

      <label style="font-size: 0.75rem; color: rgba(255,255,255,0.6); display: block; margin-bottom: 4px;">Group Name</label>
      <input type="text" id="group-name-input" class="input-field" style="margin-bottom: 14px;">

      <label style="font-size: 0.75rem; color: rgba(255,255,255,0.6); display: block; margin-bottom: 8px;">Select Members</label>
      <div id="dm-contacts-checklist" style="max-height: 180px; overflow-y: auto; margin-bottom: 12px;">
        <!-- Injected via JavaScript -->
      </div>

      <div id="group-modal-error" class="modal-error-msg"></div>

      <div class="modal-btn-group">
        <button class="modal-btn-cancel" onclick="closeCreateGroupModal()">Cancel</button>
        <button class="auth-btn modal-btn-submit" id="submit-create-group-btn">Create Group</button>
      </div>
    </div>
  </div>

  <!-- Enable Notifications Modal -->
  <div class="modal-overlay" id="notif-modal">
    <div class="modal-box" style="text-align: center;">
      <h3 style="font-weight: 800; font-size: 1.1rem; margin-bottom: 10px;">Stay in the loop</h3>
      <p style="font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 20px;">
        Turn on notifications so you don't miss new messages when the app is closed.
      </p>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="nav-btn" onclick="dismissNotifModal()">Maybe Later</button>
        <button class="auth-btn" onclick="handleEnableNotifsClick()">Enable</button>
      </div>
    </div>
  </div>

  <!-- Fullscreen Avatar Modal -->
  <div id="avatar-modal" class="avatar-modal" onclick="closeAvatarModal()">
    <img id="modal-avatar-img" src="" alt="Profile Picture">
  </div>

  <script>
    const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';
    let lastKnownMsgCount = 0;
    let activeUser = '';
    let knownDmContacts = new Set();

    function cleanPreviewText(text) {
      if (!text) return '';
      let clean = text;
      // Strip reply metadata: [reply:username|snippet]
      if (clean.startsWith('[reply:')) {
        const splitIdx = clean.indexOf(']');
        if (splitIdx !== -1) clean = clean.substring(splitIdx + 1).trim();
      }
      if (clean.startsWith('[img]')) return '📷 Photo';
      if (clean.startsWith('[sticker]')) return '🎨 Sticker';
      if (clean.startsWith('[audio]')) return '🎙️ Voice note';
      return clean;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('/sw.js');
        } catch (swErr) {
          console.error('Service Worker Registration Failed:', swErr);
        }
      }

      const rawActive = localStorage.getItem('username') || localStorage.getItem('retro_session') || '';
      activeUser = rawActive.trim().replace('@', '');

      if (!activeUser) {
        window.location.href = 'auth.html';
        return;
      }

      const profileBtn = document.getElementById('profile-btn');
      if (profileBtn) {
        profileBtn.textContent = activeUser;
      }

      if ('Notification' in window && Notification.permission === 'default') {
        setTimeout(() => {
          document.getElementById('notif-modal').classList.add('active');
        }, 800);
      }

      registerPushSubscription(activeUser);

      const joinCodeInput = document.getElementById('join-code-input');
      const joinCodeBtn = document.getElementById('join-code-btn');
      const codeError = document.getElementById('code-error');

      async function handleCodeJoin() {
        const inputCode = joinCodeInput.value.trim().toUpperCase();
        if (!inputCode) return;

        joinCodeBtn.disabled = true;
        joinCodeBtn.textContent = 'Searching...';
        codeError.style.display = 'none';

        try {
          const res = await fetch(`${API_BASE_URL}/api/users`);
          if (!res.ok) throw new Error('Failed to fetch users list');
          const users = await res.json();

          const matchedUser = users.find(u => {
            const username = (typeof u === 'string' ? u : u.username || '').trim().replace('@', '');
            return getChatCode(username) === inputCode;
          });

          if (matchedUser) {
            const targetUsername = typeof matchedUser === 'string' ? matchedUser : matchedUser.username;

            if (targetUsername.toLowerCase() === activeUser.toLowerCase()) {
              codeError.textContent = 'You cannot chat with yourself!';
              codeError.style.display = 'block';
              joinCodeBtn.disabled = false;
              joinCodeBtn.textContent = 'Search';
              return;
            }

            window.location.href = `chat.html?user=${encodeURIComponent(targetUsername)}`;
          } else {
            codeError.textContent = 'Invalid Chat Code. Please check and try again.';
            codeError.style.display = 'block';
            joinCodeBtn.disabled = false;
            joinCodeBtn.textContent = 'Search';
          }
        } catch (err) {
          console.error('Error resolving code:', err);
          codeError.textContent = 'Network error. Could not verify code.';
          codeError.style.display = 'block';
          joinCodeBtn.disabled = false;
          joinCodeBtn.textContent = 'Search';
        }
      }

      function getChatCode(user) {
        let hash = 0;
        const str = user.toLowerCase() + "_retro_secret_salt";
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        const cleanHash = Math.abs(hash).toString(36).toUpperCase().substring(0, 5);
        return `RETRO-${cleanHash}`;
      }

      if (joinCodeBtn) joinCodeBtn.addEventListener('click', handleCodeJoin);
      if (joinCodeInput) {
        joinCodeInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') handleCodeJoin();
        });
      }

      const openGroupBtn = document.getElementById('open-create-group-btn');
      const submitGroupBtn = document.getElementById('submit-create-group-btn');

      if (openGroupBtn) openGroupBtn.addEventListener('click', openCreateGroupModal);
      if (submitGroupBtn) submitGroupBtn.addEventListener('click', handleCreateGroupSubmit);

      loadInbox();
      loadUserGroups();
      setInterval(() => {
        loadInbox();
        loadUserGroups();
      }, 4000);
    });

    function logout() {
      localStorage.removeItem('username');
      localStorage.removeItem('retro_session');
      window.location.href = 'auth.html';
    }

    function dismissNotifModal() {
      const modal = document.getElementById('notif-modal');
      if (!modal) return;
      modal.classList.remove('active');
    }

    async function handleEnableNotifsClick() {
      try {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          registerPushSubscription(activeUser);
        }
      } catch (err) {
        console.error('Notification permission error:', err);
      } finally {
        dismissNotifModal();
      }
    }

    function openChat(username, timestamp) {
      localStorage.setItem(`read_${username.toLowerCase()}`, timestamp);

      fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}/mark-read`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ other_user: username })
      }).catch(err => console.error('Mark-read failed:', err));

      window.location.href = `chat.html?user=${encodeURIComponent(username)}`;
    }

    function openGroupChat(groupId) {
      window.location.href = `groupchat.html?groupId=${groupId}`;
    }

    function viewInboxAvatar(event, imgSrc) {
      event.stopPropagation();
      const modal = document.getElementById('avatar-modal');
      const modalImg = document.getElementById('modal-avatar-img');
      if (modal && modalImg) {
        modalImg.src = imgSrc;
        modal.classList.add('active');
      }
    }

    function closeAvatarModal() {
      const modal = document.getElementById('avatar-modal');
      if (modal) modal.classList.remove('active');
    }

    function previewGroupAvatar(event) {
      const file = event.target.files[0];
      const previewImg = document.getElementById('avatar-preview-img');
      const icon = document.getElementById('avatar-picker-icon');

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          previewImg.src = e.target.result;
          previewImg.style.display = 'block';
          icon.style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    }

    function showGroupModalError(msg) {
      const errBox = document.getElementById('group-modal-error');
      if (errBox) {
        errBox.textContent = msg;
        errBox.style.display = 'block';
      }
    }

    function hideGroupModalError() {
      const errBox = document.getElementById('group-modal-error');
      if (errBox) {
        errBox.style.display = 'none';
        errBox.textContent = '';
      }
    }

    function openCreateGroupModal() {
      hideGroupModalError();
      const modal = document.getElementById('create-group-modal');
      const contactsContainer = document.getElementById('dm-contacts-checklist');
      
      const sortedContacts = Array.from(knownDmContacts).sort((a, b) => a.localeCompare(b));

      if (sortedContacts.length === 0) {
        contactsContainer.innerHTML = '<div class="empty-contacts-notice">No DM contacts available</div>';
      } else {
        contactsContainer.innerHTML = sortedContacts.map(contact => `
          <div class="contact-select-item">
            <span style="font-size:0.85rem; font-weight:600;">@${contact}</span>
            <input type="checkbox" value="${contact}" class="group-member-checkbox">
          </div>
        `).join('');
      }

      modal.classList.add('active');
    }

    function closeCreateGroupModal() {
      const modal = document.getElementById('create-group-modal');
      modal.classList.remove('active');
      document.getElementById('group-name-input').value = '';
      document.getElementById('group-avatar-input').value = '';
      hideGroupModalError();
      
      const previewImg = document.getElementById('avatar-preview-img');
      const icon = document.getElementById('avatar-picker-icon');
      if (previewImg) {
        previewImg.src = '';
        previewImg.style.display = 'none';
      }
      if (icon) icon.style.display = 'inline';
    }

    async function handleCreateGroupSubmit() {
      hideGroupModalError();
      const nameInput = document.getElementById('group-name-input');
      const fileInput = document.getElementById('group-avatar-input');
      const submitBtn = document.getElementById('submit-create-group-btn');

      const groupName = nameInput.value.trim();
      if (!groupName) {
        showGroupModalError('Please enter a group name.');
        return;
      }

      const checkedMembers = Array.from(document.querySelectorAll('.group-member-checkbox:checked')).map(cb => cb.value);

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';

      let avatarBase64 = null;
      if (fileInput.files[0]) {
        avatarBase64 = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.readAsDataURL(fileInput.files[0]);
        });
      }

      try {
        const res = await fetch(`${API_BASE_URL}/api/groups`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: groupName,
            avatar: avatarBase64,
            created_by: activeUser,
            members: checkedMembers || []
          })
        });

        const data = await res.json();
        if (res.ok && data.group) {
          closeCreateGroupModal();
          window.location.href = `groupchat.html?groupId=${data.group.id}`;
        } else {
          showGroupModalError(data.error || 'Failed to create group.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Group';
        }
      } catch (err) {
        console.error('Error creating group:', err);
        showGroupModalError('Network error while creating group.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Group';
      }
    }

    async function loadUserGroups() {
      if (!activeUser) return;

      try {
        const res = await fetch(`${API_BASE_URL}/api/groups/user/${encodeURIComponent(activeUser)}`);
        if (!res.ok) return;
        const data = await res.json();
        const groups = Array.isArray(data) ? data : (data.groups || []);

        const groupListContainer = document.getElementById('group-list');
        if (!groupListContainer) return;

        if (!groups || groups.length === 0) {
          groupListContainer.innerHTML = '<div style="font-size:0.8rem; color:rgba(255,255,255,0.4); font-style:italic;">No group chats yet.</div>';
          return;
        }

        groupListContainer.innerHTML = groups.map(g => `
          <div class="chat-card" onclick="openGroupChat('${g.id}')">
            <div class="inbox-card-avatar" ${g.avatar ? `onclick="viewInboxAvatar(event, '${g.avatar}')"` : ''}>
              ${g.avatar 
                ? `<img src="${g.avatar}" class="inbox-avatar-img" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">` 
                : `<span class="inbox-avatar-initial">${g.name.charAt(0).toUpperCase()}</span>`
              }
            </div>
            <div class="inbox-card-content">
              <div class="inbox-card-header">
                <div class="inbox-card-username">${g.name}</div>
              </div>
              <div class="inbox-card-preview">Tap to enter group chat</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load user groups:', err);
      }
    }

    function updateHomeScreenBadge(count) {
      if ('setAppBadge' in navigator) {
        if (count > 0) {
          navigator.setAppBadge(count).catch((err) => console.error('Badge error:', err));
        } else {
          navigator.clearAppBadge().catch((err) => console.error('Badge error:', err));
        }
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function registerPushSubscription(username) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (Notification.permission !== 'granted') return;

      try {
        const registration = await navigator.serviceWorker.ready;
        const res = await fetch(`${API_BASE_URL}/api/vapid-key`);
        if (!res.ok) return;
        const { publicKey } = await res.json();

        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey)
          });
        }

        await fetch(`${API_BASE_URL}/api/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, subscription })
        });
      } catch (err) {
        console.error('Push subscription failed:', err);
      }
    }

    async function loadInbox() {
      const lowerActive = activeUser.toLowerCase();
      if (!activeUser) return;

      try {
        let userAvatars = {};
        try {
          const usersRes = await fetch(`${API_BASE_URL}/api/users`);
          if (usersRes.ok) {
            const usersList = await usersRes.json();
            usersList.forEach(u => {
              if (typeof u === 'object') {
                const uname = (u.username || u.name || '').trim().replace('@', '').toLowerCase();
                const pfp = u.pfp || u.avatar || u.profile_picture || u.profilePic || u.image;
                if (uname && pfp) {
                  userAvatars[uname] = pfp;
                  localStorage.setItem(`retro_pfp_${uname}`, pfp);
                }
              }
            });
          }
        } catch (uErr) {
          console.error('Error loading user avatars:', uErr);
        }

        let response = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}`);
        if (!response.ok) return;
        
        let messages = await response.json();

        if ((!messages || messages.length === 0) && activeUser !== lowerActive) {
          const fallbackRes = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(lowerActive)}`);
          if (fallbackRes.ok) {
            messages = await fallbackRes.json();
          }
        }

        const inboxList = document.getElementById('inbox-list');
        const emptyState = document.getElementById('empty-state');
        
        if (!inboxList) return;

        if (!messages || messages.length === 0) {
          inboxList.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          document.title = 'RETRO | Inbox';
          updateHomeScreenBadge(0);
          return;
        }

        lastKnownMsgCount = messages.length;
        const conversationMap = {};
        
        messages.forEach(msg => {
          const senderRaw = msg.sender_username || msg.sender || '';
          const receiverRaw = msg.receiver_username || msg.receiver || '';
          
          const sender = senderRaw.trim().replace('@', '').toLowerCase();
          const receiver = receiverRaw.trim().replace('@', '').toLowerCase();
          
          let otherUserDisplay = '';
          if (sender === lowerActive) {
            otherUserDisplay = receiverRaw.trim().replace('@', '');
          } else if (receiver === lowerActive) {
            otherUserDisplay = senderRaw.trim().replace('@', '');
          }

          if (!otherUserDisplay || otherUserDisplay.toLowerCase() === lowerActive) return;

          knownDmContacts.add(otherUserDisplay);

          const mapKey = otherUserDisplay.toLowerCase();
          const msgDate = new Date(msg.created_at || msg.timestamp || Date.now());

          if (!conversationMap[mapKey]) {
            conversationMap[mapKey] = {
              username: otherUserDisplay,
              sender: sender,
              content: msg.content || '',
              created_at: msgDate,
              unreadCount: 0
            };
          }

          const lastReadTime = localStorage.getItem(`read_${mapKey}`);
          const isIncoming = sender !== lowerActive;
          const isUnread = isIncoming && (!lastReadTime || msgDate > new Date(lastReadTime));

          if (isUnread) {
            conversationMap[mapKey].unreadCount++;
          }

          if (msgDate >= new Date(conversationMap[mapKey].created_at)) {
            conversationMap[mapKey].created_at = msgDate;
            conversationMap[mapKey].content = msg.content || '';
            conversationMap[mapKey].sender = sender;
          }
        });

        const conversations = Object.values(conversationMap).sort((a, b) => {
          return new Date(b.created_at) - new Date(a.created_at);
        });

        if (conversations.length === 0) {
          inboxList.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          document.title = 'RETRO | Inbox';
          updateHomeScreenBadge(0);
          return;
        }

        if (emptyState) emptyState.style.display = 'none';

        const totalUnread = conversations.reduce((acc, conv) => acc + conv.unreadCount, 0);

        if (totalUnread > 0) {
          document.title = `(${totalUnread}) RETRO | Inbox`;
          updateHomeScreenBadge(totalUnread);
        } else {
          document.title = 'RETRO | Inbox';
          updateHomeScreenBadge(0);
        }

        inboxList.innerHTML = conversations.map(conv => {
          const time = new Date(conv.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const hasUnread = conv.unreadCount > 0;
          const cardClass = hasUnread ? 'chat-card unread' : 'chat-card';
          
          const unameLower = conv.username.toLowerCase();
          const avatarPfp = userAvatars[unameLower] || localStorage.getItem(`retro_pfp_${unameLower}`);

          return `
            <div class="${cardClass}" onclick="openChat('${conv.username}', '${conv.created_at.toISOString()}')">
              <div class="inbox-card-avatar" ${avatarPfp ? `onclick="viewInboxAvatar(event, '${avatarPfp}')"` : ''}>
                ${avatarPfp 
                  ? `<img src="${avatarPfp}" class="inbox-avatar-img" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">` 
                  : `<span class="inbox-avatar-initial">${conv.username.charAt(0).toUpperCase()}</span>`
                }
              </div>
              <div class="inbox-card-content">
                <div class="inbox-card-header">
                  <div class="inbox-card-username">${conv.username}</div>
                  ${hasUnread ? `<span class="unread-badge">${conv.unreadCount} new</span>` : ''}
                </div>
                <div class="inbox-card-preview">${cleanPreviewText(conv.content)}</div>
                <div class="inbox-card-time">${time}</div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Failed to load inbox:', err);
      }
    }
  </script>
</body>
</html>
