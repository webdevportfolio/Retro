<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="nav-bar">
    <a href="index.html" class="logo-glow">RETRO</a>
    <div>
  <a href="profile.html" id="profile-btn" class="nav-btn">User</a>
  <button class="nav-btn" onclick="logout()" style="margin-left: 6px;">Logout</button>
</div>

  </header>

  <!-- Main Feed -->
  <main class="main-container">
    <div class="inbox-header">
      <h2>Inbox</h2>
    </div>

    <div id="chat-list" class="chat-list"></div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-title">No Active Messages</div>
      <div class="empty-sub">Share your profile link to receive ephemeral chats.</div>
    </div>
  </main>
  <script>
    const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';

    // 1. Core initialization on page load
    window.addEventListener('DOMContentLoaded', () => {
      // Grab target recipient from URL parameter ?u=
      const urlParams = new URLSearchParams(window.location.search);
      const targetUser = urlParams.get('u');

      if (targetUser) {
        localStorage.setItem('pendingChatUser', targetUser);
      }

      // Check if active user is authenticated using 'username'
      const activeUser = localStorage.getItem('username') || localStorage.getItem('retro_session');

      if (!activeUser) {
        // Not logged in -> Redirect to auth page
        window.location.href = 'auth.html';
        return;
      }

      // User IS logged in -> Update navbar button to show username
      const profileBtn = document.getElementById('profile-btn');
      if (profileBtn) {
        profileBtn.textContent = activeUser;
      }

      // Check if someone clicked a share link to chat with this user
      const pendingUser = localStorage.getItem('pendingChatUser');
      if (pendingUser && pendingUser !== activeUser) {
        localStorage.removeItem('pendingChatUser');
        window.location.href = `chat.html?user=${pendingUser}`;
        return;
      }

      // Otherwise, load normal inbox messages
      loadInboxMessages();
      setInterval(loadInboxMessages, 4000);
    });

    function logout() {
      localStorage.removeItem('username');
      localStorage.removeItem('retro_session');
      window.location.href = 'auth.html';
    }
// Filter out messages where the conversation partner is YOURSELF
const uniqueConversations = messages.filter(msg => {
  const sender = msg.sender_username?.toLowerCase().trim().replace('@', '');
  const receiver = msg.receiver_username?.toLowerCase().trim().replace('@', '');
  const active = activeUser.toLowerCase().trim().replace('@', '');

  // The other person in the chat cannot be yourself
  const otherUser = sender === active ? receiver : sender;
  
  // Exclude chats with yourself completely
  return otherUser && otherUser !== active;
});

            async function loadInbox() {
      const rawActive = localStorage.getItem('username') || localStorage.getItem('retro_session') || '';
      const activeUser = rawActive.trim().replace('@', '').toLowerCase();
      
      if (!activeUser) {
        window.location.href = 'auth.html';
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/messages/${activeUser}`);
        if (!response.ok) return;
        
        const messages = await response.json();
        const inboxList = document.getElementById('inbox-list'); // Ensure this matches your HTML container ID

        if (!messages || messages.length === 0) {
          inboxList.innerHTML = `<p style="color: rgba(255,255,255,0.4); text-align: center; margin-top: 40px;">No messages yet.</p>`;
          return;
        }

        const conversationMap = {};
        
        messages.forEach(msg => {
          // Support various property names depending on backend setup
          const senderRaw = msg.sender_username || msg.sender || '';
          const receiverRaw = msg.receiver_username || msg.receiver || '';
          
          const sender = senderRaw.trim().replace('@', '').toLowerCase();
          const receiver = receiverRaw.trim().replace('@', '').toLowerCase();
          
          // Determine the other user
          let otherUser = '';
          if (sender === activeUser) {
            otherUser = receiverRaw.trim().replace('@', '');
          } else if (receiver === activeUser) {
            otherUser = senderRaw.trim().replace('@', '');
          }

          // Skip if it's yourself or empty
          if (!otherUser || otherUser.toLowerCase() === activeUser) return;

          const mapKey = otherUser.toLowerCase();
          const msgDate = new Date(msg.created_at || msg.timestamp || Date.now());

          if (!conversationMap[mapKey] || msgDate > new Date(conversationMap[mapKey].created_at)) {
            conversationMap[mapKey] = {
              username: otherUser, // Clean name without '@'
              content: msg.content || '',
              created_at: msgDate
            };
          }
        });

        const conversations = Object.values(conversationMap);

        if (conversations.length === 0) {
          inboxList.innerHTML = `<p style="color: rgba(255,255,255,0.4); text-align: center; margin-top: 40px;">No messages yet.</p>`;
          return;
        }

        inboxList.innerHTML = conversations.map(conv => {
          const time = new Date(conv.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          return `
            <div class="inbox-card" onclick="window.location.href='chat.html?user=${encodeURIComponent(conv.username)}'">
              <div class="inbox-card-username">${conv.username}</div>
              <div class="inbox-card-preview">${conv.content}</div>
              <div class="inbox-card-time">${time}</div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Failed to load inbox:', err);
      }
    }


const displayUsername = otherUser.replace('@', '');

    function openChat(username) {
      window.location.href = `chat.html?user=${username}`;
    }

    function checkEmptyState() {
      const chatList = document.getElementById('chat-list');
      const emptyState = document.getElementById('empty-state');
      if (!chatList || !emptyState) return;
      
      if (chatList.querySelectorAll('.chat-card').length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
      }
    }

    // Countdown timer ticks every second
    setInterval(() => {
      const clocks = document.querySelectorAll('.timer-clock');
      clocks.forEach(clock => {
        let seconds = parseInt(clock.getAttribute('data-seconds'));
        if (seconds > 0) {
          seconds--;
          clock.setAttribute('data-seconds', seconds);
          const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
          const secs = (seconds % 60).toString().padStart(2, '0');
          clock.textContent = `${mins}:${secs}`;
        } else {
          const card = clock.closest('.chat-card');
          if (card) {
            card.remove();
            checkEmptyState();
          }
        }
      });
    }, 1000);
  </script>

</body>
</html>
