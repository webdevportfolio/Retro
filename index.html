<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#000000">
  <style>
    .inbox-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .unread-badge {
      background: #a855f7;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
    }
  </style>
  <meta property="og:title" content="RETRO">
  <meta property="og:description" content="Chat freely and securely.">
  <meta property="og:image" content="https://webdevportfolio.github.io/Retro/icon.png">
  <meta property="og:url" content="https://webdevportfolio.github.io/Retro/index.html">
  <meta property="og:type" content="website">
</head>
<body class="inbox-body">

  <!-- Top Navigation Bar -->
  <header class="nav-bar">
    <a href="index.html" class="logo-glow">RETRO</a>
    <div>
      <a href="profile.html" id="profile-btn" class="nav-btn">User</a>
      <button class="nav-btn" onclick="logout()" style="margin-left: 6px;">Logout</button>
    </div>
  </header>

  <!-- Main Feed -->
  <main class="main-container">
    <div class="inbox-header">
      <h2>Inbox</h2>
      <button class="nav-btn" onclick="toggleGroupModal(true)" style="border-color: var(--accent-purple); color: var(--accent-purple);">+ Group</button>
    </div>

    <!-- Enter Private Chat Code Section -->
    <div class="code-entry-card">
      <div class="code-input-wrapper">
        <input type="text" id="join-code-input" placeholder="Enter Private Chat Code" class="input-field code-join-field">
        <button id="join-code-btn" class="auth-btn join-btn">Search</button>
      </div>
      <div id="code-error" class="code-error-msg"></div>
    </div>

    <!-- Container for Active Group Chats -->
    <div style="margin-bottom: 24px;">
      <div style="font-size: 0.75rem; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 700; margin-bottom: 8px;">Groups</div>
      <div id="groups-feed" class="chat-list"></div>
    </div>

    <!-- Container for Direct Messages -->
    <div>
      <div style="font-size: 0.75rem; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 700; margin-bottom: 8px;">Direct Messages</div>
      <div id="inbox-list" class="chat-list"></div>
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-title">No Active Messages</div>
      <div class="empty-sub">Enter a friend's Chat Code above to start messaging privately.</div>
    </div>
  </main>

  <!-- Create Group Modal -->
  <div class="modal-overlay" id="create-group-modal" onclick="if(event.target === this) toggleGroupModal(false)">
    <div class="modal-box" style="text-align: left; border-color: var(--glass-border); max-height: 85vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-weight: 800; font-size: 1.1rem;">Create New Group</h3>
        <button onclick="toggleGroupModal(false)" style="background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer;">&times;</button>
      </div>

      <form onsubmit="handleCreateGroup(event)" style="display: flex; flex-direction: column; gap: 14px;">
        <div>
          <label style="font-size: 0.75rem; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 700; display: block; margin-bottom: 6px;">Group Name</label>
          <input type="text" id="new-group-name" class="input-field" placeholder="Enter group name..." required>
        </div>

        <div>
          <label style="font-size: 0.75rem; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 700; display: block; margin-bottom: 6px;">Select Members from DMs</label>
          <div id="dm-members-selection" style="max-height: 180px; overflow-y: auto; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
            <div style="font-size: 0.8rem; color: rgba(255,255,255,0.4);">Loading contacts...</div>
          </div>
        </div>

        <button type="submit" class="auth-btn" style="margin-top: 8px;">Create Group</button>
      </form>
    </div>
  </div>

  <!-- Enable Notifications Modal -->
  <div class="modal-overlay" id="notif-modal">
    <div class="modal-box" style="text-align: center;">
      <h3 style="font-weight: 800; font-size: 1.1rem; margin-bottom: 10px;">Stay in the loop</h3>
      <p style="font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 20px;">
        Turn on notifications so you don't miss new messages when the app is closed.
      </p>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="nav-btn" onclick="dismissNotifModal()">Maybe Later</button>
        <button class="auth-btn" onclick="handleEnableNotifsClick()">Enable</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';
    let lastKnownMsgCount = 0;
    let activeUser = '';

    window.addEventListener('DOMContentLoaded', async () => {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('/sw.js');
        } catch (swErr) {
          console.error('Service Worker Registration Failed:', swErr);
        }
      }

      const rawActive = localStorage.getItem('username') || localStorage.getItem('retro_session') || '';
      activeUser = rawActive.trim().replace('@', '');

      if (!activeUser) {
        window.location.href = 'auth.html';
        return;
      }

      const profileBtn = document.getElementById('profile-btn');
      if (profileBtn) {
        profileBtn.textContent = activeUser;
      }

      // Notification permission is gated behind a user gesture (required on iOS,
      // and best practice everywhere else). Shown as a popup instead of a nav button.
      if ('Notification' in window && Notification.permission === 'default') {
        setTimeout(() => {
          document.getElementById('notif-modal').classList.add('active');
        }, 800);
      }

      registerPushSubscription(activeUser);

      // Chat Code Input Event Listeners
      const joinCodeInput = document.getElementById('join-code-input');
      const joinCodeBtn = document.getElementById('join-code-btn');
      const codeError = document.getElementById('code-error');

      async function handleCodeJoin() {
        const inputCode = joinCodeInput.value.trim().toUpperCase();
        if (!inputCode) return;

        joinCodeBtn.disabled = true;
        joinCodeBtn.textContent = 'Searching...';
        codeError.style.display = 'none';

        try {
          const res = await fetch(`${API_BASE_URL}/api/users`);
          if (!res.ok) throw new Error('Failed to fetch users list');
          const users = await res.json();

          const matchedUser = users.find(u => {
            const username = (typeof u === 'string' ? u : u.username || '').trim().replace('@', '');
            return getChatCode(username) === inputCode;
          });

          if (matchedUser) {
            const targetUsername = typeof matchedUser === 'string' ? matchedUser : matchedUser.username;

            if (targetUsername.toLowerCase() === activeUser.toLowerCase()) {
              codeError.textContent = 'You cannot chat with yourself!';
              codeError.style.display = 'block';
              joinCodeBtn.disabled = false;
              joinCodeBtn.textContent = 'Search';
              return;
            }

            window.location.href = `chat.html?user=${encodeURIComponent(targetUsername)}`;
          } else {
            codeError.textContent = 'Invalid Chat Code. Please check and try again.';
            codeError.style.display = 'block';
            joinCodeBtn.disabled = false;
            joinCodeBtn.textContent = 'Search';
          }
        } catch (err) {
          console.error('Error resolving code:', err);
          codeError.textContent = 'Network error. Could not verify code.';
          codeError.style.display = 'block';
          joinCodeBtn.disabled = false;
          joinCodeBtn.textContent = 'Search';
        }
      }

      function getChatCode(user) {
        let hash = 0;
        const str = user.toLowerCase() + "_retro_secret_salt";
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        const cleanHash = Math.abs(hash).toString(36).toUpperCase().substring(0, 5);
        return `RETRO-${cleanHash}`;
      }

      if (joinCodeBtn) joinCodeBtn.addEventListener('click', handleCodeJoin);
      if (joinCodeInput) {
        joinCodeInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') handleCodeJoin();
        });
      }

      loadInbox();
      fetchUserGroups();

      setInterval(() => {
        loadInbox();
        fetchUserGroups();
      }, 4000);
    });

    function logout() {
      localStorage.removeItem('username');
      localStorage.removeItem('retro_session');
      window.location.href = 'auth.html';
    }

    function dismissNotifModal() {
      const modal = document.getElementById('notif-modal');
      if (!modal) return;
      modal.classList.remove('active');
    }

    async function handleEnableNotifsClick() {
      try {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          registerPushSubscription(activeUser);
        }
      } catch (err) {
        console.error('Notification permission error:', err);
      } finally {
        dismissNotifModal();
      }
    }

    function openChat(username, timestamp) {
      localStorage.setItem(`read_${username.toLowerCase()}`, timestamp);

      fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}/mark-read`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ other_user: username })
      }).catch(err => console.error('Mark-read failed:', err));

      window.location.href = `chat.html?user=${encodeURIComponent(username)}`;
    }

    function updateHomeScreenBadge(count) {
      if ('setAppBadge' in navigator) {
        if (count > 0) {
          navigator.setAppBadge(count).catch((err) => console.error('Badge error:', err));
        } else {
          navigator.clearAppBadge().catch((err) => console.error('Badge error:', err));
        }
      }
    }

    async function registerPushSubscription(username) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (Notification.permission !== 'granted') return;

      try {
        const registration = await navigator.serviceWorker.ready;
        const res = await fetch(`${API_BASE_URL}/api/vapid-key`);
        if (!res.ok) return;
        const { publicKey } = await res.json();

        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey)
          });
        }

        await fetch(`${API_BASE_URL}/api/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, subscription })
        });
      } catch (err) {
        console.error('Push subscription failed:', err);
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function toggleGroupModal(open) {
      const modal = document.getElementById('create-group-modal');
      if (!modal) return;

      if (open) {
        modal.classList.add('active');
        document.getElementById('new-group-name').value = '';
        await loadDmContactsForGroup();
      } else {
        modal.classList.remove('active');
      }
    }

    async function loadDmContactsForGroup() {
      const container = document.getElementById('dm-members-selection');
      if (!container) return;

      const lowerActive = activeUser.toLowerCase();

      try {
        const res = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}`);
        if (!res.ok) throw new Error('Failed to fetch messages');
        
        const messages = await res.json();
        const contactsSet = new Set();

        messages.forEach(msg => {
          const sender = (msg.sender_username || msg.sender || '').trim().replace('@', '');
          const receiver = (msg.receiver_username || msg.receiver || '').trim().replace('@', '');

          if (sender && sender.toLowerCase() !== lowerActive) contactsSet.add(sender);
          if (receiver && receiver.toLowerCase() !== lowerActive) contactsSet.add(receiver);
        });

        const contacts = Array.from(contactsSet);

        if (contacts.length === 0) {
          container.innerHTML = `<div style="font-size: 0.8rem; color: rgba(255,255,255,0.4);">No DM contacts found yet.</div>`;
          return;
        }

        container.innerHTML = contacts.map(username => `
          <label style="display: flex; align-items: center; gap: 10px; font-size: 0.9rem; cursor: pointer; padding: 4px 0;">
            <input type="checkbox" class="group-member-checkbox" value="${username}" style="accent-color: var(--accent-purple); width: 16px; height: 16px;">
            <span>${username}</span>
          </label>
        `).join('');

      } catch (err) {
        console.error('Failed to load DM contacts:', err);
        container.innerHTML = `<div style="font-size: 0.8rem; color: #ef4444;">Error loading contacts.</div>`;
      }
    }

    async function handleCreateGroup(event) {
      event.preventDefault();

      const nameInput = document.getElementById('new-group-name');
      const groupName = nameInput.value.trim();

      const checkedBoxes = document.querySelectorAll('.group-member-checkbox:checked');
      const selectedMembers = Array.from(checkedBoxes).map(cb => cb.value);

      if (!groupName) return;

      try {
        const res = await fetch(`${API_BASE_URL}/api/groups`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: groupName,
            created_by: activeUser,
            members: selectedMembers
          })
        });

        if (res.ok) {
          const newGroup = await res.json();
          toggleGroupModal(false);
          window.location.href = `groupchat.html?id=${newGroup.id}`;
        } else {
          alert('Failed to create group. Check server connection.');
        }
      } catch (err) {
        console.error('Error creating group:', err);
      }
    }

    async function fetchUserGroups() {
      if (!activeUser) return;
      try {
        const res = await fetch(`${API_BASE_URL}/api/users/${activeUser}/groups`);
        if (!res.ok) return;

        const groups = await res.json();
        renderGroupsList(groups);
      } catch (err) {
        console.error('Failed to fetch groups:', err);
      }
    }

    function renderGroupsList(groups) {
      const container = document.getElementById('groups-feed');
      if (!container) return;

      if (!groups || groups.length === 0) {
        container.innerHTML = `<div style="font-size: 0.85rem; color: rgba(255,255,255,0.4); padding: 8px 0;">No group chats joined yet.</div>`;
        return;
      }

      container.innerHTML = groups.map(g => `
        <div class="chat-card" onclick="window.location.href='groupchat.html?id=${g.id}'">
          <div class="inbox-card-avatar">
            <span class="inbox-avatar-initial">👥</span>
          </div>
          <div class="inbox-card-content">
            <div class="inbox-card-header">
              <div class="inbox-card-username">${g.name}</div>
            </div>
            <div class="inbox-card-preview">${g.members ? g.members.length : 0} members</div>
          </div>
        </div>
      `).join('');
    }

    async function loadInbox() {
      const lowerActive = activeUser.toLowerCase();
      if (!activeUser) return;

      try {
        let response = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}`);
        if (!response.ok) return;
        
        let messages = await response.json();

        if ((!messages || messages.length === 0) && activeUser !== lowerActive) {
          const fallbackRes = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(lowerActive)}`);
          if (fallbackRes.ok) {
            messages = await fallbackRes.json();
          }
        }

        const inboxList = document.getElementById('inbox-list');
        const emptyState = document.getElementById('empty-state');
        
        if (!inboxList) return;

        if (!messages || messages.length === 0) {
          inboxList.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          document.title = 'RETRO | Inbox';
          updateHomeScreenBadge(0);
          return;
        }

        lastKnownMsgCount = messages.length;
        const conversationMap = {};
        
        messages.forEach(msg => {
          const senderRaw = msg.sender_username || msg.sender || '';
          const receiverRaw = msg.receiver_username || msg.receiver || '';
          
          const sender = senderRaw.trim().replace('@', '').toLowerCase();
          const receiver = receiverRaw.trim().replace('@', '').toLowerCase();
          
          let otherUserDisplay = '';
          if (sender === lowerActive) {
            otherUserDisplay = receiverRaw.trim().replace('@', '');
          } else if (receiver === lowerActive) {
            otherUserDisplay = senderRaw.trim().replace('@', '');
          }

          if (!otherUserDisplay || otherUserDisplay.toLowerCase() === lowerActive) return;

          const mapKey = otherUserDisplay.toLowerCase();
          const msgDate = new Date(msg.created_at || msg.timestamp || Date.now());

          if (!conversationMap[mapKey]) {
            conversationMap[mapKey] = {
              username: otherUserDisplay,
              sender: sender,
              content: msg.content || '',
              created_at: msgDate,
              unreadCount: 0
            };
          }

          const lastReadTime = localStorage.getItem(`read_${mapKey}`);
          const isIncoming = sender !== lowerActive;
          const isUnread = isIncoming && (!lastReadTime || msgDate > new Date(lastReadTime));

          if (isUnread) {
            conversationMap[mapKey].unreadCount++;
          }

          if (msgDate >= new Date(conversationMap[mapKey].created_at)) {
            conversationMap[mapKey].created_at = msgDate;
            conversationMap[mapKey].content = msg.content || '';
            conversationMap[mapKey].sender = sender;
          }
        });

        const conversations = Object.values(conversationMap).sort((a, b) => {
          return new Date(b.created_at) - new Date(a.created_at);
        });

        if (conversations.length === 0) {
          inboxList.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          document.title = 'RETRO | Inbox';
          updateHomeScreenBadge(0);
          return;
        }

        if (emptyState) emptyState.style.display = 'none';

        const totalUnread = conversations.reduce((acc, conv) => acc + conv.unreadCount, 0);

        if (totalUnread > 0) {
          document.title = `(${totalUnread}) RETRO | Inbox`;
          updateHomeScreenBadge(totalUnread);
        } else {
          document.title = 'RETRO | Inbox';
          updateHomeScreenBadge(0);
        }

        inboxList.innerHTML = conversations.map(conv => {
          const time = new Date(conv.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const hasUnread = conv.unreadCount > 0;
          const cardClass = hasUnread ? 'chat-card unread' : 'chat-card';
          const avatarPfp = localStorage.getItem(`retro_pfp_${conv.username.toLowerCase()}`);

          return `
            <div class="${cardClass}" onclick="openChat('${conv.username}', '${conv.created_at.toISOString()}')">
              <div class="inbox-card-avatar">
                ${avatarPfp 
                  ? `<img src="${avatarPfp}" class="inbox-avatar-img">` 
                  : `<span class="inbox-avatar-initial">${conv.username.charAt(0).toUpperCase()}</span>`
                }
              </div>
              <div class="inbox-card-content">
                <div class="inbox-card-header">

                  <div class="inbox-card-username">${conv.username}</div>
                  ${hasUnread ? `<span class="unread-badge">${conv.unreadCount} new</span>` : ''}
                </div>
                <div class="inbox-card-preview">${conv.content}</div>
                <div class="inbox-card-time">${time}</div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Failed to load inbox:', err);
      }
    }
  </script>
</body>
</html>
