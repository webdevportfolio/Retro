<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO - Inbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="nav-bar">
    <a href="index.html" class="logo-glow">RETRO</a>
    <a href="profile.html" id="profile-btn" class="nav-btn">profile</a>
  </header>

  <!-- Main Inbox Container -->
  <main class="main-container">
    
    <div class="inbox-header">
      <h2>Messages</h2>
    </div>

    <!-- Active Chat Feed -->
    <div id="chat-list" class="chat-list">
      
      <!-- Unread Chat Item Example -->
      <div class="chat-card unread" onclick="openChat('alex')">
        <div class="chat-info">
          <div class="chat-meta">
            <span class="unread-badge">NEW</span>
            <span class="chat-username">alex</span>
          </div>
          <div class="chat-preview">Tap to view message</div>
        </div>
        <div class="timer-clock frozen">05:00</div>
      </div>

      <!-- Active Chat Item Example -->
      <div class="chat-card" onclick="openChat('jordan')">
        <div class="chat-info">
          <div class="chat-meta">
            <span class="chat-username">jordan</span>
          </div>
          <div class="chat-preview">See you there!</div>
        </div>
        <div class="timer-clock" data-seconds="149">02:29</div>
      </div>

    </div>

    <!-- Empty Inbox State (Hidden by default) -->
    <div id="empty-state" class="empty-state" style="display: none;">
      <p class="empty-title">No Active Messages</p>
      <p class="empty-sub">Share your profile link to start a new chat before messages vanish!</p>
    </div>

  </main>

 
   <script>
  // Replace this with your live server URL once deployed (e.g., https://your-render-url.onrender.com)
  const API_BASE_URL = 'http://localhost:3000'; 

  // Verify Session
  const activeUser = localStorage.getItem('retro_session');
  if (!activeUser) {
    window.location.href = 'auth.html';
  } else {
    document.getElementById('profile-btn').textContent = activeUser;
    loadInboxMessages();
  }

  async function loadInboxMessages() {
    const chatList = document.getElementById('chat-list');
    
    try {
      const response = await fetch(`${API_BASE_URL}/api/messages/${activeUser}`);
      const messages = await response.json();

      if (!response.ok || !messages.length) {
        chatList.innerHTML = '';
        checkEmptyState();
        return;
      }

      // Group messages by sender or display recent incoming items
      chatList.innerHTML = messages.map(msg => {
        const expiresAt = new Date(msg.expires_at).getTime();
        const now = new Date().getTime();
        const secondsLeft = Math.max(0, Math.floor((expiresAt - now) / 1000));
        
        const mins = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
        const secs = (secondsLeft % 60).toString().padStart(2, '0');

        return `
          <div class="chat-card" onclick="openChat('${msg.sender_username}')">
            <div class="chat-info">
              <div class="chat-meta">
                <span class="chat-username">${msg.sender_username}</span>
              </div>
              <div class="chat-preview">${msg.content}</div>
            </div>
            <div class="timer-clock" data-seconds="${secondsLeft}">${mins}:${secs}</div>
          </div>
        `;
      }).join('');

      checkEmptyState();
    } catch (err) {
      console.error('Failed to load messages:', err);
      checkEmptyState();
    }
  }

  function openChat(username) {
    window.location.href = `chat.html?user=${username}`;
  }

  function checkEmptyState() {
    const chatList = document.getElementById('chat-list');
    const emptyState = document.getElementById('empty-state');
    const activeCards = chatList.querySelectorAll('.chat-card');

    if (activeCards.length === 0) {
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
    }
  }

  // Live Countdown Timer
  setInterval(() => {
    const clocks = document.querySelectorAll('.timer-clock:not(.frozen)');
    clocks.forEach(clock => {
      let seconds = parseInt(clock.getAttribute('data-seconds'));
      if (seconds > 0) {
        seconds--;
        clock.setAttribute('data-seconds', seconds);
        
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = (seconds % 60).toString().padStart(2, '0');
        clock.textContent = `${mins}:${secs}`;
      } else {
        const card = clock.closest('.chat-card');
        if (card) {
          card.remove();
          checkEmptyState();
        }
      }
    });
  }, 1000);


  </script>
</body>
</html>
