<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate RETRO Icon</title>
  <style>
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      color: #fff;
    }
    canvas {
      border-radius: 96px;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #a855f7;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <canvas id="iconCanvas" width="512" height="512"></canvas>
  <button onclick="downloadIcon()">Download icon.png</button>

  <script>
    const canvas = document.getElementById('iconCanvas');
    const ctx = canvas.getContext('2d');

    // Solid Black Background
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, 512, 512);

    // Subtle radial purple background glow
    const bgGlow = ctx.createRadialGradient(256, 256, 20, 256, 256, 256);
    bgGlow.addColorStop(0, 'rgba(168, 85, 247, 0.25)');
    bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = bgGlow;
    ctx.fillRect(0, 0, 512, 512);

    // Outer Neon Glow for "R"
    ctx.shadowColor = '#a855f7';
    ctx.shadowBlur = 40;
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 320px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Draw central glowing "R"
    ctx.fillText('R', 256, 270);

    // Function to download as 512x512 icon.png
    function downloadIcon() {
      const link = document.createElement('a');
      link.download = 'icon.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
