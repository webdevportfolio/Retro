<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Games</title>
<link rel="stylesheet" href="games.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#08080a">
</head>
<body class="games-page">

<div class="games-app">

<header class="games-header">
<a href="index.html" class="games-back">←</a>
<div class="games-brand">RETRO</div>
<div class="games-header-spacer"></div>
</header>

<main class="games-main">

<!-- GAME SELECTION -->
<div id="game-selection">

<section class="games-intro">
<div class="games-label">RETRO GAMES</div>
<h1>Play against your friends.</h1>
</section>

<section class="games-section">
<div class="games-section-title">CHOOSE A GAME</div>

<div class="game-card" onclick="selectGame('tictactoe')">
<div class="game-icon tic-icon">×<span>○</span></div>
<div class="game-info">
<h2>Tic Tac Toe</h2>
<p>Quick. Simple. Competitive.</p>
</div>
<div class="game-arrow">→</div>
</div>

<div class="game-card" onclick="selectGame('chess')">
<div class="game-icon chess-icon">♟</div>
<div class="game-info">
<h2>Chess</h2>
<p>Think ahead. Make your move.</p>
</div>
<div class="game-arrow">→</div>
</div>

</section>

<section class="games-footer-message">
<div class="footer-line"></div>
<div class="footer-line"></div>
</section>

</div>


<!-- OPPONENT SELECTION -->
<div id="opponent-selection" style="display:none">

<section class="games-intro">
<div class="games-label" id="selected-game-label">TIC TAC TOE</div>
<h1>Choose your opponent.</h1>
</section>

<section class="games-section">
<div class="games-section-title">YOUR DMS</div>

<div id="opponent-list">
<div class="games-loading">Loading...</div>
</div>

</section>

<section class="games-footer-message">
<div class="footer-line"></div>
<span>YOU CAN ONLY PLAY WITH PEOPLE IN YOUR DMS</span>
<div class="footer-line"></div>
</section>

</div>

</main>
</div>

<script>
const API_BASE_URL='https://retro-backend-hnsv.onrender.com';
let activeUser='';
let selectedGame='';

window.addEventListener('DOMContentLoaded',()=>{
const rawActive=localStorage.getItem('username')||localStorage.getItem('retro_session')||'';
activeUser=rawActive.trim().replace('@','');

if(!activeUser){
window.location.href='auth.html';
return;
}
});

function selectGame(game){
selectedGame=game;

document.getElementById('game-selection').style.display='none';
document.getElementById('opponent-selection').style.display='block';

document.getElementById('selected-game-label').textContent=
game==='chess'?'CHESS':'TIC TAC TOE';

loadOpponents();
}

async function loadOpponents(){
const list=document.getElementById('opponent-list');

list.innerHTML='<div class="games-loading">Loading...</div>';

try{
const response=await fetch(`${API_BASE_URL}/api/conversations?username=${encodeURIComponent(activeUser)}`);

if(!response.ok)throw new Error('Failed to load conversations');

const data=await response.json();
const conversations=data.conversations||[];

if(!conversations.length){
list.innerHTML='<div class="games-empty">No friends in DM</div>';
return;
}

const opponentData=await Promise.all(conversations.map(async conv=>{
const username=conv.other_user;
let pfp='';

try{
const userRes=await fetch(`${API_BASE_URL}/api/users/${encodeURIComponent(username)}?t=${Date.now()}`);

if(userRes.ok){
const userData=await userRes.json();
pfp=userData.profile_picture||userData.pfpUrl||userData.photoURL||userData.pfp||'';
}
}catch(err){
console.error('Avatar error:',err);
}

return{username,pfp};
}));

list.innerHTML=opponentData.map(user=>`
<div class="opponent-card" onclick="startGame('${escapeHtml(user.username)}')">
<div class="opponent-avatar">
${user.pfp
?`<img src="${user.pfp}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span style="display:none">${user.username.charAt(0).toUpperCase()}</span>`
:`<span>${user.username.charAt(0).toUpperCase()}</span>`}
</div>

<div class="opponent-info">
<div class="opponent-name">${escapeHtml(user.username)}</div>
<div class="opponent-preview">Tap to challenge</div>
</div>

<div class="opponent-arrow">→</div>
</div>
`).join('');

}catch(error){
console.error('Opponent loading error:',error);
list.innerHTML='<div class="games-empty">No friends in DM</div>';
}
}

function startGame(username){
if(selectedGame==='tictactoe'){
window.location.href=`tictactoe.html?opponent=${encodeURIComponent(username)}`;
}else if(selectedGame==='chess'){
window.location.href=`chess.html?opponent=${encodeURIComponent(username)}`;
}
}

function escapeHtml(text){
return text.replace(/[&<>"']/g,char=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[char]));
}
</script>

</body>
</html>
