<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO | Join</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-card">
    <div class="logo">RETRO</div>
    <div id="subtitle" class="auth-subtitle">Welcome back. Enter your details.</div>
    <div id="error-box" class="error-msg"></div>

    <form id="auth-form" onsubmit="event.preventDefault(); handleSubmit();">
      <div class="form-group">
        <input 
          type="text" 
          id="username" 
          name="username"
          class="input-field" 
          placeholder="Username" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <input 
          type="password" 
          id="password" 
          name="password"
          class="input-field" 
          placeholder="Password" 
          required
          autocomplete="current-password"
        >
        <span class="toggle-password" id="eye-btn" onclick="togglePassword()">SHOW</span>
      </div>

      <button type="submit" id="submit-btn" class="auth-btn">Log In</button>
    </form>

    <div class="switch-mode">
      <span id="switch-text">Need an account?</span>
      <span id="switch-btn" class="switch-link" onclick="toggleMode()">Sign Up</span>
    </div>
  </div>

<script>
  const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';
  let isLogin = true;

  function togglePassword() {
    const pwdInput = document.getElementById('password');
    const eyeBtn = document.getElementById('eye-btn');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeBtn.innerText = 'HIDE';
    } else {
      pwdInput.type = 'password';
      eyeBtn.innerText = 'SHOW';
    }
  }

  function toggleMode() {
    isLogin = !isLogin;
    document.getElementById('subtitle').innerText = isLogin 
      ? 'Welcome back. Enter your details.' 
      : 'Create an account to get started.';
    document.getElementById('submit-btn').innerText = isLogin ? 'Log In' : 'Sign Up';
    document.getElementById('switch-text').innerText = isLogin ? 'Need an account?' : 'Already have an account?';
    document.getElementById('switch-btn').innerText = isLogin ? 'Sign Up' : 'Log In';
    
    const errorBox = document.getElementById('error-box');
    if (errorBox) {
      errorBox.innerText = '';
      errorBox.style.display = 'none';
    }
  }

  async function handleSubmit() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    errorBox.innerText = '';
    errorBox.style.display = 'none';

    if (!username || !password) {
      errorBox.innerText = 'Please fill out all fields.';
      errorBox.style.display = 'block';
      return;
    }

    // Set loading state
    submitBtn.disabled = true;
    const originalText = submitBtn.innerText;
    submitBtn.innerText = 'Connecting...';
    
    // Alert user if response is taking longer than usual (Render spin-up)
    const wakeUpTimer = setTimeout(() => {
      errorBox.innerText = 'Server is waking up from sleep mode, please wait a few seconds...';
      errorBox.style.color = '#eab308'; // Warning yellow
      errorBox.style.display = 'block';
    }, 3000);

    const endpoint = isLogin 
      ? `${API_BASE_URL}/api/login` 
      : `${API_BASE_URL}/api/register`;

    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      clearTimeout(wakeUpTimer);
      const data = await response.json();

      if (!response.ok) {
        errorBox.style.color = '#ef4444'; // Error red
        errorBox.innerText = data.error || 'Something went wrong.';
        errorBox.style.display = 'block';
        resetButton();
        return;
      }

      if (isLogin) {
        localStorage.setItem('retro_session', data.user.username);
        window.location.href = 'index.html';
      } else {
        alert('Account created! Logging you in...');
        localStorage.setItem('retro_session', username);
        window.location.href = 'index.html';
      }
    } catch (err) {
      clearTimeout(wakeUpTimer);
      errorBox.style.color = '#ef4444';
      errorBox.innerText = 'Connection error. Tap Sign Up again to retry.';
      errorBox.style.display = 'block';
      resetButton();
    }

    function resetButton() {
      submitBtn.disabled = false;
      submitBtn.innerText = originalText;
    }
  }
</script>


</body>
</html>
