<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO|Join</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-card">
    <div class="logo">RETRO</div>
    <div id="subtitle" class="auth-subtitle">Welcome back. Enter your details.</div>
    <div id="error-box" class="error-msg"></div>

    <form id="auth-form" action="#" method="POST">
      <div class="form-group">
        <input 
          type="text" 
          id="username" 
          name="username"
          class="input-field" 
          placeholder="Username" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <input 
          type="password" 
          id="password" 
          name="password"
          class="input-field" 
          placeholder="Password" 
          required
          autocomplete="current-password"
        >
        <span class="toggle-password" id="eye-btn">SHOW</span>
      </div>

      <button type="submit" id="submit-btn" class="auth-btn">Log In</button>
    </form>

    <div class="switch-mode">
      <span id="switch-text">Need an account?</span>
      <span id="switch-btn" class="switch-link">Sign Up</span>
    </div>
  </div>

<script>
  // Your Live Render Server Base URL
  const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';

  let isLogin = true;

  function toggleMode() {
    isLogin = !isLogin;
    document.getElementById('form-title').innerText = isLogin ? 'Login to Retro' : 'Register for Retro';
    document.getElementById('submit-btn').innerText = isLogin ? 'Login' : 'Register';
    document.getElementById('toggle-btn').innerText = isLogin ? 'Need an account? Register' : 'Already have an account? Login';
    document.getElementById('error-msg').innerText = '';
  }

  async function handleSubmit() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('error-msg');
    errorMsg.innerText = '';

    if (!username || !password) {
      errorMsg.innerText = 'Please enter both username and password.';
      return;
    }

    const endpoint = isLogin 
      ? `${API_BASE_URL}/api/login` 
      : `${API_BASE_URL}/api/register`;
    
    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (!response.ok) {
        errorMsg.innerText = data.error || 'Something went wrong.';
        return;
      }

      if (isLogin) {
        // Save user session and go to inbox (index.html)
        localStorage.setItem('retro_session', data.user.username);
        window.location.href = 'index.html';
      } else {
        alert('Registration successful! You can now log in.');
        toggleMode();
      }
    } catch (err) {
      errorMsg.innerText = 'Network error. Server might still be waking up.';
    }
  }
</script>

</body>
</html>
