<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO | Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="nav-bar">
    <a href="index.html" class="nav-btn">← Back</a>
    <div class="chat-header-title">Profile</div>
    <div style="width: 50px;"></div>
  </header>

  <main class="main-container">
    <div class="auth-card glass-panel" style="max-width: 100%;">
      <div class="profile-avatar">
        <span id="avatar-initial">M</span>
      </div>
      
      <h2 id="display-username" class="profile-name">username</h2>
      <p class="profile-status">Status: Active</p>

      <!-- Personal Chat Link Box -->
      <div class="link-box">
        <label class="link-label">Your Direct Chat Link</label>
        <div class="link-input-group">
          <input type="text" id="user-link-input" readonly class="input-field link-field">
          <button id="copy-btn" class="copy-btn">Copy</button>
        </div>
      </div>

      <div class="profile-meta-box">
        <div class="meta-item">
          <span class="meta-label">Password</span>
          <span class="meta-value">••••••••</span>
        </div>
      </div>

      <button id="logout-btn" class="logout-btn">Log Out</button>
    </div>
  </main>
<script>
document.addEventListener('DOMContentLoaded', () => {
<script>
document.addEventListener('DOMContentLoaded', () => {
  // 1. Fetch current logged-in user using your correct session key
  const currentUser = localStorage.getItem('retro_session') || localStorage.getItem('username');

  // Redirect to login if unauthenticated
  if (!currentUser) {
    window.location.href = 'auth.html';
    return;
  }

  // 2. DOM Element Selectors
  const avatarLetter = document.getElementById('avatar-initial');
  const usernameDisplay = document.getElementById('display-username');
  const linkInput = document.getElementById('user-link-input');
  const copyBtn = document.getElementById('copy-btn');
  const logoutBtn = document.getElementById('logout-btn');

  // 3. Update Profile UI Info
  if (usernameDisplay) {
    usernameDisplay.textContent = currentUser;
  }

  if (avatarLetter) {
    avatarLetter.textContent = currentUser.charAt(0).toUpperCase();
  }

  // 4. Construct Direct Chat URL
  const directLink = `https://webdevportfolio.github.io/Retro/index.html?u=${encodeURIComponent(currentUser)}`;

  if (linkInput) {
    linkInput.value = directLink;
  }

  // 5. Copy Button Logic with Fallbacks
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(directLink);
        } else {
          if (linkInput) {
            linkInput.select();
            linkInput.setSelectionRange(0, 99999);
            document.execCommand('copy');
          }
        }

        const originalText = copyBtn.innerText;
        copyBtn.innerText = 'Copied!';
        copyBtn.style.opacity = '0.8';

        setTimeout(() => {
          copyBtn.innerText = originalText;
          copyBtn.style.opacity = '1';
        }, 2000);
      } catch (err) {
        console.error('Failed to copy: ', err);
        alert('Could not copy link automatically. Please select and copy manually.');
      }
    });
  }

  // 6. Logout Handler
  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('username');
      localStorage.removeItem('username');
      window.location.href = 'auth.html';
    });
  }
});
</script>

</body>
</html>
