<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat</title>
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="chat-app-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="user-info" id="profileTrigger">
        <div class="avatar-wrapper">
          <div class="avatar" id="headerAvatar">?</div>
          <div class="status-dot" id="statusDot"></div>
        </div>
        <div class="user-details">
          <h3 id="targetUsername">Chat Partner</h3>
          <span id="targetStatusText">Offline</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="toggleProfileBtn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>
    </header>

    <!-- Message Stream -->
    <main class="chat-messages" id="chatMessages">
      <!-- Dynamic messages injected here -->
    </main>

    <!-- Quoted Reply Bar -->
    <div class="reply-preview-bar" id="replyPreviewBar" style="display: none;">
      <span id="replyPreviewText">Replying to message...</span>
      <button id="cancelReplyBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Sticker Drawer -->
    <div class="sticker-drawer" id="stickerDrawer" style="display: none;"></div>

    <!-- Bottom Input Container -->
    <footer class="chat-input-container">
      <div class="chat-input-row">
        <!-- Media Attachments -->
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        <button class="input-icon-btn" id="attachBtn" title="Attach Image"><i class="fa-solid fa-paperclip"></i></button>
        <button class="input-icon-btn" id="stickerToggleBtn" title="Stickers"><i class="fa-regular fa-face-smile"></i></button>
        
        <!-- Text Input -->
        <input type="text" class="chat-input-field" id="messageInput" placeholder="Type a message..." autocomplete="off">
        
        <!-- Voice Note / Send Button -->
        <button class="input-icon-btn" id="voiceNoteBtn" title="Hold/Click to record voice note"><i class="fa-solid fa-microphone"></i></button>
        <button class="send-action-btn" id="sendMessageBtn"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </footer>

    <!-- Image Preview Modal -->
    <div class="modal-overlay" id="imagePreviewModal" style="display: none;">
      <div class="modal-content">
        <h3>Send Photo</h3>
        <div class="preview-img-container">
          <img id="previewImage" src="" alt="Preview">
        </div>
        <input type="text" class="chat-input-field" id="imageCaptionInput" placeholder="Add a caption...">
        <div class="modal-actions">
          <button class="cancel-btn" id="cancelImageBtn">Cancel</button>
          <button class="image-send-btn send-btn" id="sendImageBtn">Send</button>
        </div>
      </div>
    </div>

    <!-- Partner Profile Slide-Over Sheet -->
    <aside class="profile-sheet" id="profileSheet">
      <div class="profile-sheet-avatar" id="sheetAvatar">?</div>
      <h2 id="sheetUsername">User</h2>
      
      <div class="private-code-box">
        <span>Private Chat Code</span>
        <code id="privateChatCode">RETRO-000000</code>
      </div>

      <button class="clear-chat-btn" id="clearChatBtn"><i class="fa-solid fa-trash"></i> Clear Conversation</button>
    </aside>
  </div>

  <script>
    // ==========================================
    // State & Target Resolution
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    let rawTarget = urlParams.get('user') || localStorage.getItem('last_chat_target') || 'Guest';
    const targetUser = rawTarget.replace(/^@/, '').trim();
    localStorage.setItem('last_chat_target', targetUser);

    let activeReply = null;
    let pendingImageBase64 = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // DOM Elements
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendMessageBtn = document.getElementById('sendMessageBtn');
    const fileInput = document.getElementById('fileInput');
    const attachBtn = document.getElementById('attachBtn');
    const imagePreviewModal = document.getElementById('imagePreviewModal');
    const previewImage = document.getElementById('previewImage');
    const sendImageBtn = document.getElementById('sendImageBtn');
    const cancelImageBtn = document.getElementById('cancelImageBtn');
    const imageCaptionInput = document.getElementById('imageCaptionInput');
    const stickerToggleBtn = document.getElementById('stickerToggleBtn');
    const stickerDrawer = document.getElementById('stickerDrawer');
    const voiceNoteBtn = document.getElementById('voiceNoteBtn');
    const replyPreviewBar = document.getElementById('replyPreviewBar');
    const replyPreviewText = document.getElementById('replyPreviewText');
    const cancelReplyBtn = document.getElementById('cancelReplyBtn');
    
    const profileSheet = document.getElementById('profileSheet');
    const profileTrigger = document.getElementById('profileTrigger');
    const toggleProfileBtn = document.getElementById('toggleProfileBtn');
    const targetUsername = document.getElementById('targetUsername');
    const sheetUsername = document.getElementById('sheetUsername');
    const headerAvatar = document.getElementById('headerAvatar');
    const sheetAvatar = document.getElementById('sheetAvatar');
    const privateChatCode = document.getElementById('privateChatCode');
    const clearChatBtn = document.getElementById('clearChatBtn');
    const statusDot = document.getElementById('statusDot');
    const targetStatusText = document.getElementById('targetStatusText');

    // Init User Displays
    targetUsername.textContent = `@${targetUser}`;
    sheetUsername.textContent = `@${targetUser}`;
    const initial = targetUser.charAt(0).toUpperCase();
    headerAvatar.textContent = initial;
    sheetAvatar.textContent = initial;
    privateChatCode.textContent = generateChatHash(targetUser);

    // ==========================================
    // Client-Side Canvas Image Compression
    // ==========================================
    /**
     * Resizes and compresses an image file using HTML5 Canvas.
     * @param {File} file - The uploaded image file.
     * @param {number} maxWidth - Max width in pixels.
     * @param {number} maxHeight - Max height in pixels.
     * @param {number} quality - Compression quality (0.0 to 1.0).
     * @returns {Promise<string>} Base64 Data URL.
     */
    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            // Preserve aspect ratio while constraining dimensions
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Export lossy JPEG string to keep payload small
            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    // Attachment Picker Event
    attachBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        // Compress image via Canvas before rendering modal or sending
        pendingImageBase64 = await compressImage(file, 1200, 1200, 0.75);
        previewImage.src = pendingImageBase64;
        imagePreviewModal.style.display = 'flex';
      } catch (err) {
        console.error("Canvas compression failed:", err);
        alert("Failed to process image.");
      } finally {
        fileInput.value = '';
      }
    });

    cancelImageBtn.addEventListener('click', () => {
      imagePreviewModal.style.display = 'none';
      pendingImageBase64 = null;
      previewImage.src = '';
    });

    sendImageBtn.addEventListener('click', () => {
      if (!pendingImageBase64) return;
      
      const caption = imageCaptionInput.value.trim();
      let payload = `[img]${pendingImageBase64}[/img]`;
      if (caption) payload += `\n${caption}`;

      dispatchMessage(payload);

      // Reset Modal
      imagePreviewModal.style.display = 'none';
      pendingImageBase64 = null;
      imageCaptionInput.value = '';
      previewImage.src = '';
    });

    // ==========================================
    // Messaging & Rendering Logic
    // ==========================================
    function dispatchMessage(text) {
      if (!text) return;

      let formattedText = text;
      if (activeReply) {
        formattedText = `[reply:${activeReply.id}]${text}`;
        clearReply();
      }

      renderMessageBubble({
        id: Date.now(),
        sender: 'self',
        content: formattedText,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        read: true
      });

      // API Post Call
      fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: targetUser, message: formattedText })
      }).catch(err => console.error("Send message error:", err));

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function renderMessageBubble(msg) {
      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper ${msg.sender === 'self' ? 'sent' : 'received'}`;
      wrapper.dataset.msgId = msg.id;

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';

      let content = msg.content;

      // Handle Quoted Replies
      if (content.startsWith('[reply:')) {
        const match = content.match(/^\[reply:(.*?)\]/);
        if (match) {
          const replyDiv = document.createElement('div');
          replyDiv.className = 'quoted-reply';
          replyDiv.textContent = 'Replying to previous message...';
          bubble.appendChild(replyDiv);
          content = content.replace(/^\[reply:.*?\]/, '');
        }
      }

      // Handle Image Tags
      if (content.includes('[img]')) {
        const imgMatch = content.match(/\[img\](.*?)\[\/img\]/);
        if (imgMatch) {
          const imgEl = document.createElement('img');
          imgEl.src = imgMatch[1];
          imgEl.className = 'media-image';
          bubble.appendChild(imgEl);
          content = content.replace(/\[img\].*?\[\/img\]/, '').trim();
        }
      }

      // Handle Sticker Tags
      if (content.includes('[sticker]')) {
        const stickerMatch = content.match(/\[sticker\](.*?)\[\/sticker\]/);
        if (stickerMatch) {
          const stickerEl = document.createElement('img');
          stickerEl.src = stickerMatch[1];
          stickerEl.className = 'sticker-img';
          bubble.appendChild(stickerEl);
          content = content.replace(/\[sticker\].*?\[\/sticker\]/, '').trim();
        }
      }

      // Handle Voice Audio Tags
      if (content.includes('[audio]')) {
        const audioMatch = content.match(/\[audio\](.*?)\[\/audio\]/);
        if (audioMatch) {
          const audioPlayer = createAudioPlayer(audioMatch[1]);
          bubble.appendChild(audioPlayer);
          content = content.replace(/\[audio\].*?\[\/audio\]/, '').trim();
        }
      }

      if (content) {
        const textSpan = document.createElement('span');
        textSpan.textContent = content;
        bubble.appendChild(textSpan);
      }

      // Time & Read Receipt
      const meta = document.createElement('div');
      meta.className = 'message-meta';
      meta.innerHTML = `<span>${msg.time}</span> ${msg.sender === 'self' ? '<span class="read-receipt">✓✓</span>' : ''}`;
      bubble.appendChild(meta);

      wrapper.appendChild(bubble);

      // Swipe-to-Reply Touch Support
      attachSwipeGesture(wrapper, msg);

      chatMessages.appendChild(wrapper);
    }

    // Audio Player Construction
    function createAudioPlayer(src) {
      const container = document.createElement('div');
      container.className = 'audio-player';

      const playBtn = document.createElement('button');
      playBtn.className = 'audio-play-btn';
      playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';

      const track = document.createElement('div');
      track.className = 'audio-track';
      const progress = document.createElement('div');
      progress.className = 'audio-progress';
      track.appendChild(progress);

      const audio = new Audio(src);

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        } else {
          audio.pause();
          playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }
      });

      audio.addEventListener('timeupdate', () => {
        const pct = (audio.currentTime / audio.duration) * 100;
        progress.style.width = `${pct}%`;
      });

      audio.addEventListener('ended', () => {
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        progress.style.width = '0%';
      });

      container.appendChild(playBtn);
      container.appendChild(track);
      return container;
    }

    // Swipe-to-Reply Gesture
    function attachSwipeGesture(element, msg) {
      let startX = 0;
      let currentX = 0;

      element.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
      }, { passive: true });

      element.addEventListener('touchmove', (e) => {
        currentX = e.touches[0].clientX;
        const diffX = currentX - startX;
        if (diffX > 0 && diffX < 80) {
          element.style.transform = `translateX(${diffX}px)`;
        }
      }, { passive: true });

      element.addEventListener('touchend', () => {
        const diffX = currentX - startX;
        if (diffX > 50) {
          setReplyState(msg);
        }
        element.style.transform = 'translateX(0px)';
        startX = 0;
        currentX = 0;
      });
    }

    function setReplyState(msg) {
      activeReply = msg;
      replyPreviewText.textContent = `Replying to: ${msg.content.substring(0, 30)}...`;
      replyPreviewBar.style.display = 'flex';
      messageInput.focus();
    }

    function clearReply() {
      activeReply = null;
      replyPreviewBar.style.display = 'none';
    }

    cancelReplyBtn.addEventListener('click', clearReply);

    // Send Input Event
    sendMessageBtn.addEventListener('click', () => {
      const text = messageInput.value.trim();
      if (text) {
        dispatchMessage(text);
        messageInput.value = '';
      }
    });

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessageBtn.click();
      }
    });

    // ==========================================
    // Sticker Drawer & Storage
    // ==========================================
    function initStickerDrawer() {
      const stickers = JSON.parse(localStorage.getItem('chat_stickers') || '[]');
      stickerDrawer.innerHTML = '';
      stickers.forEach((dataUrl) => {
        const img = document.createElement('img');
        img.src = dataUrl;
        img.className = 'sticker-item';
        img.addEventListener('click', () => {
          dispatchMessage(`[sticker]${dataUrl}[/sticker]`);
          stickerDrawer.style.display = 'none';
        });
        stickerDrawer.appendChild(img);
      });
    }

    stickerToggleBtn.addEventListener('click', () => {
      const visible = stickerDrawer.style.display === 'grid';
      stickerDrawer.style.display = visible ? 'none' : 'grid';
      if (!visible) initStickerDrawer();
    });

    // ==========================================
    // Voice Note Recording
    // ==========================================
    voiceNoteBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              dispatchMessage(`[audio]${reader.result}[/audio]`);
            };
          };

          mediaRecorder.start();
          isRecording = true;
          voiceNoteBtn.classList.add('recording');
        } catch (err) {
          alert('Microphone access denied or unavailable.');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        voiceNoteBtn.classList.remove('recording');
      }
    });

    // ==========================================
    // Profile Sheet & Utilities
    // ==========================================
    function toggleProfileSheet() {
      profileSheet.classList.toggle('active');
    }

    profileTrigger.addEventListener('click', toggleProfileSheet);
    toggleProfileBtn.addEventListener('click', toggleProfileSheet);

    clearChatBtn.addEventListener('click', () => {
      if (confirm('Clear all local chat messages?')) {
        chatMessages.innerHTML = '';
        toggleProfileSheet();
      }
    });

    function generateChatHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return `RETRO-${Math.abs(hash).toString(16).toUpperCase().padStart(6, '0')}`;
    }

    // Poll & Heartbeat Setup
    setInterval(() => {
      fetch(`/api/heartbeat?user=${targetUser}`).catch(() => {});
    }, 15000);
  </script>
</body>
</html>
