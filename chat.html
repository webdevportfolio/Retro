<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO - Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="nav-bar">
    <a href="index.html" class="nav-btn">← Back</a>
    <div id="chat-with-user" class="chat-header-title">username</div>
    <a href="profile.html" id="profile-btn" class="nav-btn">profile</a>
  </header>

  <!-- Chat Messages Stream -->
  <main class="chat-container">
    <div id="messages-list" class="messages-list">
      
      <!-- Received Message Bubble -->
      <div class="message-wrapper received">
        <div class="message-bubble">
          <p class="message-text">Yo, did you check out the new design drop?</p>
          <div class="message-meta">
            <span class="timer-clock" data-seconds="280">04:40</span>
          </div>
        </div>
      </div>

      <!-- Sent Message Bubble -->
      <div class="message-wrapper sent">
        <div class="message-bubble">
          <p class="message-text">Yeah man, it looks clean!</p>
          <div class="message-meta">
            <span class="timer-clock" data-seconds="295">04:55</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Fixed Bottom Message Input Bar -->
  <footer class="chat-input-bar">
    <form id="chat-form">
      <input 
        type="text" 
        id="message-input" 
        class="input-field chat-field" 
        placeholder="Type a message..." 
        autocomplete="off"
        required
      >
      <button type="submit" class="send-btn">Send</button>
    </form>
  </footer>

  <script>
    // Verify Session
    const activeUser = localStorage.getItem('retro_session');
    if (!activeUser) {
      window.location.href = 'auth.html';
    } else {
      document.getElementById('profile-btn').textContent = activeUser;
    }

    // Get Target Username from URL query string (?user=alex)
    const urlParams = new URLSearchParams(window.location.search);
    const targetUser = urlParams.get('user') || 'Chat';
    document.getElementById('chat-with-user').textContent = targetUser;

    // Send Message Handler
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const messagesList = document.getElementById('messages-list');

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      // Create Sent Message Bubble
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper sent';
      wrapper.innerHTML = `
        <div class="message-bubble">
          <p class="message-text">${escapeHtml(text)}</p>
          <div class="message-meta">
            <span class="timer-clock" data-seconds="300">05:00</span>
          </div>
        </div>
      `;

      messagesList.appendChild(wrapper);
      messageInput.value = '';

      // Auto scroll to bottom
      window.scrollTo(0, document.body.scrollHeight);
    });

    function escapeHtml(string) {
      return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Live Countdown Timer for Messages
    setInterval(() => {
      const clocks = document.querySelectorAll('.timer-clock');
      clocks.forEach(clock => {
        let seconds = parseInt(clock.getAttribute('data-seconds'));
        if (seconds > 0) {
          seconds--;
          clock.setAttribute('data-seconds', seconds);
          
          const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
          const secs = (seconds % 60).toString().padStart(2, '0');
          clock.textContent = `${mins}:${secs}`;
        } else {
          // Message expires - remove bubble
          const wrapper = clock.closest('.message-wrapper');
          if (wrapper) wrapper.remove();
        }
      });
    }, 1000);
  </script>
</body>
</html>
