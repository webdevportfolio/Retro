<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Chat</title>
<link rel="stylesheet" href="chat.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#000">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  /* Mobile 100vh fix */
  html, body {
    height: 100%;
    height: 100dvh;
    margin: 0;
  }
  .chat-app-container {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body>
<div class="chat-app-container">
<header class="nav-bar">
<a href="index.html" class="nav-btn">← Back</a>
<div class="chat-header-user" onclick="openAvatarView()">
<div class="chat-header-avatar-wrapper">
<div class="chat-header-avatar" id="header-avatar-container">
<img id="header-avatar-img" src="" alt="Avatar" style="display:none">
<span id="header-avatar-initial">?</span>
</div>
<div class="online-dot" id="online-dot" style="display:none" title="Active"></div>
</div>
<div>
<div id="chat-with-user" class="chat-header-title">Loading...</div>
<div id="typing-indicator" class="typing-indicator"></div>
</div>
</div>
<button type="button" class="three-dots-btn" onclick="openAvatarView()">⋮</button>
</header>

<main class="chat-container" id="chat-container">
<div id="messages-list" class="messages-list"></div>
</main>

<div id="sticker-drawer" class="sticker-drawer">
<div class="sticker-drawer-header">
<span>Your Stickers (<span id="sticker-count">0</span>/10)</span>
<button class="close-reply-btn" onclick="toggleStickerDrawer()">✕</button>
</div>
<div class="sticker-grid" id="sticker-grid"></div>
</div>

<footer class="chat-input-bar">
<div id="reply-preview-bar" class="reply-preview-bar" style="display:none">
<div>
<div id="reply-user-label" class="reply-preview-user">Replying to</div>
<div id="reply-text-label" class="reply-preview-content"></div>
</div>
<button class="close-reply-btn" onclick="cancelReply()">✕</button>
</div>

<input type="file" id="image-file-input" accept="image/*" style="display:none" onchange="handleImageSelected(event)">
<input type="file" id="sticker-file-input" accept="image/*" style="display:none" onchange="handleStickerSelected(event)">

<form id="chat-form">
<div class="pill-input-container">
<button type="button" class="pill-btn" onclick="document.getElementById('image-file-input').click()">📎</button>
<button type="button" class="pill-btn" onclick="toggleStickerDrawer()">😀</button>
<input type="text" id="message-input" class="pill-input" placeholder="Message..." autocomplete="off">
<button type="button" id="vn-btn" class="pill-btn vn-btn" onclick="toggleVoiceRecording()">🎙️</button>
<button type="submit" id="send-btn" class="circular-send-btn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
</div>
</form>
</footer>
</div>

<!-- Modals -->
<div id="image-preview-modal" class="image-preview-modal" style="display:none">
<div class="image-preview-card">
<div class="sheet-header">
<div id="preview-modal-title" class="sheet-title">Preview Image</div>
<button class="close-reply-btn" onclick="closeImagePreview()">✕</button>
</div>
<div class="image-preview-container"><img id="image-preview-elem" src=""></div>
<div id="preview-modal-actions" class="image-preview-actions">
<button class="nav-btn" onclick="closeImagePreview()">Cancel</button>
<button class="nav-btn" id="crop-image-btn" onclick="cropPreviewImage()" style="color:var(--text-main)">Crop Square</button>
<button id="image-send-btn" class="send-btn" onclick="sendSelectedImage()">Send Image</button>
</div>
</div>
</div>

<div id="partner-profile-sheet" class="partner-profile-sheet">
<div id="partner-profile-card" class="partner-profile-card">
<div class="sheet-header">
<button class="nav-btn" onclick="closeAvatarView()">← Back</button>
<div class="sheet-title">Profile</div>
<div style="width:32px"></div>
</div>
<div class="sheet-avatar-wrapper"><div class="sheet-avatar"><img id="sheet-avatar-img" src="" style="display:none"><span id="sheet-avatar-initial">?</span></div></div>
<div id="sheet-username" class="sheet-username">User</div>
<div class="sheet-code-container">
<div class="sheet-code-label">PRIVATE CHAT CODE</div>
<div class="sheet-code-box">
<input id="sheet-chat-code" readonly value="Generating...">
<button id="sheet-copy-btn" onclick="copyPartnerCode()">Copy Code</button>
</div>
</div>
<button class="sheet-clear-btn" onclick="clearCurrentChat()">Clear Chat</button>
</div>
</div>

<div id="demure-toast" class="demure-toast"></div>

<script>
// XSS Sanitization Utility
function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag]));
}

const API_BASE_URL='https://retro-backend-hnsv.onrender.com';
const socket=io(API_BASE_URL);
let activeReplyTo=null,isUserScrolling=false,previousMessageCount=0,lastFetchedPfpUrl=null;
let globalAudioCtx=null;

const activeUser=(localStorage.getItem('username')||localStorage.getItem('retro_session')||'').trim().replace('@','');
const urlParams=new URLSearchParams(location.search);
let targetUser=(urlParams.get('user')||urlParams.get('username')||urlParams.get('u')||'').trim().replace('@','');

if(!activeUser)location.href='auth.html';
if(!targetUser||targetUser.toLowerCase()===activeUser.toLowerCase())location.href='index.html';

const chatTitleElem=document.getElementById('chat-with-user'),avatarImg=document.getElementById('header-avatar-img'),
avatarInitial=document.getElementById('header-avatar-initial'),chatContainer=document.getElementById('chat-container'),
messagesList=document.getElementById('messages-list'),chatForm=document.getElementById('chat-form');

if(chatTitleElem&&targetUser){
chatTitleElem.textContent=targetUser;
avatarInitial.textContent=targetUser[0].toUpperCase();
const cached=localStorage.getItem(`retro_pfp_${targetUser.toLowerCase()}`);
if(cached){avatarImg.src=cached;avatarImg.style.display='block';avatarInitial.style.display='none';lastFetchedPfpUrl=cached}
loadTargetUserProfile();
}

socket.on('connect',()=>{if(activeUser)socket.emit('register_user',activeUser);if(activeUser&&targetUser){socket.emit('join_room',{sender:activeUser,receiver:targetUser});socket.emit('check_online',targetUser)}});
socket.on('receive_message',loadChat);
socket.on('user_typing',({sender,isTyping})=>{if(sender?.toLowerCase()===targetUser.toLowerCase())document.getElementById('typing-indicator').textContent=isTyping?`${escapeHTML(targetUser)} is typing...`:''});
socket.on('online_status',({username,online})=>{if(username?.toLowerCase()===targetUser.toLowerCase())updateOnlineDot(online)});
socket.on('user_presence',({username,online})=>{if(username?.toLowerCase()===targetUser.toLowerCase())updateOnlineDot(online)});

function updateOnlineDot(on){document.getElementById('online-dot').style.display=on?'block':'none'}
function showToast(msg){const t=document.getElementById('demure-toast');t.textContent=msg;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('show'),2400)}
async function updateAppBadge(n){if('setAppBadge'in navigator)try{n>0?await navigator.setAppBadge(n):await navigator.clearAppBadge()}catch{}}
window.addEventListener('focus',()=>updateAppBadge(0));

function playNotificationSound(){
    try {
        if (!globalAudioCtx) globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (globalAudioCtx.state === 'suspended') globalAudioCtx.resume();
        const o = globalAudioCtx.createOscillator(), g = globalAudioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(587.33, globalAudioCtx.currentTime);
        g.gain.setValueAtTime(0.15, globalAudioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, globalAudioCtx.currentTime + 0.35);
        o.connect(g).connect(globalAudioCtx.destination);
        o.start();
        o.stop(globalAudioCtx.currentTime + 0.35);
    } catch(e) {}
}

function showPopUpNotification(sender,msg){if(Notification.permission==='granted'&&'serviceWorker'in navigator)navigator.serviceWorker.ready.then(r=>r.showNotification(`New message from ${sender}`,{body:formatSnippetText(msg),icon:'icon.png',badge:'icon.png',vibrate:[200,100,200],data:{url:`chat.html?user=${encodeURIComponent(sender)}`}}))}
document.addEventListener('click',()=>{if(Notification.permission==='default')Notification.requestPermission()},{once:true});

function applyAvatar(img,ini,url,name){if(!img||!ini)return;if(url){img.onerror=()=>{img.style.display='none';ini.style.display='block';ini.textContent=name?.[0]?.toUpperCase()||'?'};img.src=url;img.style.display='block';ini.style.display='none'}else{img.style.display='none';ini.style.display='block';ini.textContent=name?.[0]?.toUpperCase()||'?'}}

async function loadTargetUserProfile(){
if(!targetUser)return;
try{
let url=null,t=Date.now(),res=await fetch(`${API_BASE_URL}/api/users/${encodeURIComponent(targetUser)}?t=${t}`);
if(res.ok){const d=await res.json();url=d.pfpUrl||d.photoURL||d.pfp||d.avatar||d.image}
if(!url){res=await fetch(`${API_BASE_URL}/api/users?t=${t}`);if(res.ok){const users=await res.json();const f=users.find(u=>(u.username||u.name||'').toLowerCase()===targetUser.toLowerCase());if(f)url=f.pfpUrl||f.photoURL||f.pfp||f.avatar||f.image}}
if(url&&url!==lastFetchedPfpUrl){lastFetchedPfpUrl=url;applyAvatar(avatarImg,avatarInitial,url,targetUser);applyAvatar(document.getElementById('sheet-avatar-img'),document.getElementById('sheet-avatar-initial'),url,targetUser);localStorage.setItem(`retro_pfp_${targetUser.toLowerCase()}`,url)}
else if(!url&&lastFetchedPfpUrl!==null){lastFetchedPfpUrl=null;applyAvatar(avatarImg,avatarInitial,null,targetUser)}
}catch{}
}

function getChatCode(u){let h=0;const s=u.toLowerCase()+'_retro_secret_salt';for(let i=0;i<s.length;i++)h=(h<<5)-h+s.charCodeAt(i),h|=0;return`RETRO-${Math.abs(h).toString(36).toUpperCase().slice(0,5)}`}
function openAvatarView(){const s=document.getElementById('partner-profile-sheet');document.getElementById('sheet-username').textContent=escapeHTML(targetUser);document.getElementById('sheet-chat-code').value=getChatCode(targetUser);applyAvatar(document.getElementById('sheet-avatar-img'),document.getElementById('sheet-avatar-initial'),avatarImg.src||localStorage.getItem(`retro_pfp_${targetUser.toLowerCase()}`),targetUser);s.classList.add('active')}
function closeAvatarView(){document.getElementById('partner-profile-sheet').classList.remove('active')}
document.getElementById('partner-profile-sheet').onclick=e=>{if(e.target.id==='partner-profile-sheet')closeAvatarView()};
document.getElementById('partner-profile-card').onclick=e=>e.stopPropagation();

async function copyPartnerCode(){const i=document.getElementById('sheet-chat-code'),b=document.getElementById('sheet-copy-btn');try{await navigator.clipboard.writeText(i.value)}catch{i.select();document.execCommand('copy')}const t=b.innerText;b.innerText='Copied!';setTimeout(()=>b.innerText=t,2000)}
async function clearCurrentChat(){if(confirm(`Clear chat with ${targetUser}?`)){messagesList.innerHTML='<div style="text-align:center;color:#666;margin-top:20px">Chat cleared.</div>';closeAvatarView()}}
chatContainer.onscroll=()=>{isUserScrolling=chatContainer.scrollHeight-chatContainer.scrollTop-chatContainer.clientHeight>=50};

function formatSnippetText(c){if(!c)return'';if(c.startsWith('data:image/')&&!c.includes('sticker'))return'🖼 Image';if(c.startsWith('data:image/')||c.startsWith('[sticker]'))return'[sticker]';if(c.startsWith('[img]'))return'🖼 Image';if(c.startsWith('[audio]'))return'🎤 Voice note';return c}
function formatAudioTime(s){s=Math.floor(s)||0;return`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`}

// Safer regex parsing
function parseReplyContent(c) {
function parseReplyContent(c) {
    if (!c?.startsWith('[reply:')) return null;
    let m = c.match(/^\[reply:([^|\]]+)\|([\s\S]*?)\]\s?([\s\S]*)$/);
    if (m) {
        let replyUser = m[1];
        let replySnippet = m[2];
        let messageText = m[3];

        if (replySnippet.includes('data:audio/') || replySnippet.startsWith('[audio]')) {
            replySnippet = '🎤 Voicenote';
        } else if (replySnippet.startsWith('[sticker]')) {
            replySnippet = '🎨 Sticker';
        } else if (replySnippet.startsWith('[img]') || (replySnippet.includes('data:image/') && !replySnippet.includes('sticker'))) {
            replySnippet = '🖼 Image';
        }

        return { replyUser, replySnippet, messageText };
    }
    return null;
}

async function loadChat(){
if(!activeUser||!targetUser)return;
const res=await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}`);if(!res.ok)return;
const all=await res.json(),a=activeUser.toLowerCase(),t=targetUser.toLowerCase();
const msgs=all.filter(m=>{const s=(m.sender_username||m.sender||'').toLowerCase(),r=(m.receiver_username||m.receiver||'').toLowerCase();return(s===a&&r===t)||(s===t&&r===a)}).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
if(msgs.length>previousMessageCount&&previousMessageCount){const last=msgs.at(-1);if((last.sender_username||last.sender).toLowerCase()===t){playNotificationSound();navigator.vibrate?.([100,50,100]);updateAppBadge(1);if(document.hidden)showPopUpNotification(targetUser,parseReplyContent(last.content)?.messageText||last.content)}}
previousMessageCount=msgs.length;
if(!msgs.length){messagesList.innerHTML='<div style="text-align:center;color:#666;margin-top:20px">No messages yet. Say hi!</div>';return}
const lastIn=msgs.toReversed().find(m=>(m.sender_username||m.sender).toLowerCase()===t);if(lastIn){localStorage.setItem(`read_${t}`,lastIn.created_at);fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}/mark-read`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({other_user:targetUser})}).catch()}

messagesList.innerHTML=msgs.map(m=>{
    const s=(m.sender_username||m.sender).trim(),sent=s.toLowerCase()===a,time=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),read=m.is_read||new Date(localStorage.getItem(`read_${t}`)||0)>=new Date(m.created_at);
    let q='',c=m.content||'';
    const p=parseReplyContent(c);
    
    if(p){
        q=`<div class="quoted-reply-box"><div class="quoted-reply-user">${escapeHTML(p.replyUser)}</div><div>${escapeHTML(p.replySnippet)}</div></div>`;
        c=p.messageText;
    }
    
    let renderedContent = '';
    if(c.startsWith('data:image/')){
        const id=`stk_${Math.random().toString(36).slice(2,9)}`;
        renderedContent=`<div class="sticker-wrapper-container" onclick="toggleStickerSaveTooltip(event,'${id}')"><img src="${escapeHTML(c)}" class="msg-sticker"><div id="${id}" class="add-to-pack-tooltip" onclick="saveStickerToDrawer(event,'${escapeHTML(c)}')">Add to stickerpack</div></div>`;
    }
    else if(c.startsWith('[img]')){
        renderedContent=`<img src="${escapeHTML(c.slice(5))}" class="msg-image" onclick="openChatImageViewer('${escapeHTML(c.slice(5))}')">`;
    }
    else if(c.startsWith('[sticker]')){
        const id=`stk_${Math.random().toString(36).slice(2,9)}`,d=c.slice(9);
        renderedContent=`<div class="sticker-wrapper-container" onclick="toggleStickerSaveTooltip(event,'${id}')"><img src="${escapeHTML(d)}" class="msg-sticker"><div id="${id}" class="add-to-pack-tooltip" onclick="saveStickerToDrawer(event,'${escapeHTML(d)}')">Add to stickerpack</div></div>`;
    }
    else if(c.startsWith('[audio]')){
        const id=`vn_${m.id||Math.random().toString(36).slice(2,9)}`;
        renderedContent=`<div class="custom-audio-player" id="player_${id}"><button class="play-btn" onclick="toggleCustomAudio('${id}')">▶</button><div class="audio-track"><div id="progress_${id}" class="audio-progress"></div></div><span id="time_${id}" class="audio-time">0:00</span><audio id="${id}" src="${escapeHTML(c.slice(7))}" onloadedmetadata="initAudioDuration('${id}')" ontimeupdate="updateAudioProgress('${id}')" onended="resetAudioPlayer('${id}')"></audio></div>`;
    } else {
        renderedContent = escapeHTML(c);
    }
    
    return`<div class="message-wrapper ${sent?'sent':'received'}" data-sender="${escapeHTML(s)}" data-content="${escapeHTML(m.content||'')}"><div class="message-bubble">${q}<div class="message-text">${renderedContent}</div><div class="message-meta"><span class="timer-clock">${time}</span>${sent?`<span class="read-status ${read?'read':''}">${read?'✓✓':'✓'}</span>`:''}</div></div></div>`;
}).join('');

attachSwipeListeners();if(!isUserScrolling)setTimeout(()=>chatContainer.scrollTop=chatContainer.scrollHeight,50)
}

function toggleCustomAudio(id){const a=document.getElementById(id),p=document.getElementById(`player_${id}`),b=p.querySelector('.play-btn');document.querySelectorAll('audio').forEach(x=>{if(x.id!==id&&!x.paused){x.pause();document.querySelector(`#player_${x.id}.play-btn`).textContent='▶'}});a.paused?(a.play(),b.textContent='❚'):(a.pause(),b.textContent='▶')}
function initAudioDuration(id){const a=document.getElementById(id),t=document.getElementById(`time_${id}`);if(a&&t)t.textContent=formatAudioTime(a.duration)}
function updateAudioProgress(id){const a=document.getElementById(id),p=document.getElementById(`progress_${id}`),t=document.getElementById(`time_${id}`);p.style.width=`${a.duration?a.currentTime/a.duration*100:0}%`;t.textContent=formatAudioTime(a.currentTime)}
function resetAudioPlayer(id){document.querySelector(`#player_${id}.play-btn`).textContent='▶';document.getElementById(`progress_${id}`).style.width='0%';document.getElementById(`time_${id}`).textContent=formatAudioTime(document.getElementById(id).duration||0)}

function attachSwipeListeners(){document.querySelectorAll('.message-wrapper').forEach(w=>{let sx=0,cx=0,sw=false;w.ontouchstart=e=>{sx=e.touches[0].clientX;sw=true;w.style.transition='none'};w.ontouchmove=e=>{if(!sw)return;cx=e.touches[0].clientX-sx;if(cx>0&&cx<90)w.style.transform=`translateX(${cx}px)`};w.ontouchend=()=>{if(!sw)return;sw=false;w.style.transition='.2s';if(cx>50){let c=w.dataset.content,s=w.dataset.sender;const p=parseReplyContent(c);if(p)c=p.messageText;if(c.startsWith('[sticker]')||c.includes('data:image/'))c='[sticker]';triggerReplyUI(s,c);navigator.vibrate?.(25)}w.style.transform='translateX(0)';cx=0}})}

function triggerReplyUI(sender, text) {
    text = text || '';
    let displaySnippet = text;
    
    if (text.startsWith('[audio]') || text.includes('data:audio/')) {
        displaySnippet = '🎤 Voicenote';
    } else if (text.startsWith('[sticker]')) {
        displaySnippet = '🎨 Sticker';
    } else if (text.startsWith('[img]') || (text.includes('data:image/') && !text.includes('sticker'))) {
        displaySnippet = '🖼 Image';
    } else {
        displaySnippet = escapeHTML(formatSnippetText(text));
    }

    activeReplyTo = { sender, text: displaySnippet };
    document.getElementById('reply-user-label').textContent = `Replying to ${escapeHTML(sender)}`;
    document.getElementById('reply-text-label').textContent = displaySnippet;
    document.getElementById('reply-preview-bar').style.display = 'flex';
    document.getElementById('message-input').focus();
}
function cancelReply(){activeReplyTo=null;document.getElementById('reply-preview-bar').style.display='none'}

chatForm.onsubmit=async e=>{e.preventDefault();const i=document.getElementById('message-input'),btn=document.getElementById('send-btn');let c=i.value.trim();if(!c||!targetUser||!activeUser)return;if(activeReplyTo){let s=activeReplyTo.text||'';s=s.startsWith('[sticker]')||s.includes('data:image/')?'[sticker]':s.slice(0,40).replace(/\|/g,' ');c=`[reply:${activeReplyTo.sender}|${s}] ${c}`}btn.disabled=true;await postMessagePayload(c);i.value='';cancelReply();btn.disabled=false}

let typingTimeout;document.getElementById('message-input').oninput=()=>{socket.emit('typing',{sender:activeUser,receiver:targetUser,isTyping:true});clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>socket.emit('typing',{sender:activeUser,receiver:targetUser,isTyping:false}),2000)}

loadChat();

setInterval(() => {
    if (document.visibilityState === 'visible') {
        loadTargetUserProfile();
    }
}, 10000);

let selectedCompressedImage=null;
function handleImageSelected(e){const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=ev=>{const img=new Image;img.src=ev.target.result;img.onload=()=>{let w=img.width,h=img.height;const max=1200;if(w>h){if(w>max){h=h*max/w;w=max}}else{if(h>max){w=w*max/h;h=max}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);selectedCompressedImage=c.toDataURL('image/jpeg',.85);document.getElementById('preview-modal-title').textContent='Preview Image';document.getElementById('image-preview-elem').src=selectedCompressedImage;document.getElementById('preview-modal-actions').style.display='flex';document.getElementById('image-preview-modal').style.display='flex'}};r.readAsDataURL(f)}

function cropPreviewImage(){
    if(!selectedCompressedImage)return;
    const img=new Image();
    img.src=selectedCompressedImage;
    img.onload=()=>{
        const canvas=document.createElement('canvas');
        const size=Math.min(img.width,img.height);
        canvas.width=size;
        canvas.height=size;
        const ctx=canvas.getContext('2d');
        const startX=(img.width-size)/2;
        const startY=(img.height-size)/2;
        ctx.drawImage(img,startX,startY,size,size,0,0,size,size);
        selectedCompressedImage=canvas.toDataURL('image/jpeg',.85);
        document.getElementById('image-preview-elem').src=selectedCompressedImage;
        showToast('Cropped Square');
    }
}

function openChatImageViewer(src){document.getElementById('preview-modal-title').textContent='View Photo';document.getElementById('image-preview-elem').src=src;document.getElementById('preview-modal-actions').style.display='none';document.getElementById('image-preview-modal').style.display='flex'}
function closeImagePreview(){document.getElementById('image-preview-modal').style.display='none';document.getElementById('image-file-input').value='';selectedCompressedImage=null}
async function sendSelectedImage(){
    if(!selectedCompressedImage) return;
    
    const sendBtn = document.getElementById('image-send-btn');
    const originalText = sendBtn.textContent;
    
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending...';
    
    await postMessagePayload(`[img]${selectedCompressedImage}`);
    
    sendBtn.textContent = originalText;
    sendBtn.disabled = false;
    closeImagePreview();
}

const getSavedStickers=()=>JSON.parse(localStorage.getItem('retro_stickers')||'[]');
function toggleStickerDrawer(){const d=document.getElementById('sticker-drawer');d.classList.toggle('active');if(d.classList.contains('active'))renderStickerDrawer()}
function renderStickerDrawer(){const g=document.getElementById('sticker-grid'),s=getSavedStickers();document.getElementById('sticker-count').textContent=s.length;g.innerHTML='';s.forEach((d,i)=>g.innerHTML+=`<div class="sticker-item-wrapper"><img src="${escapeHTML(d)}" onclick="sendSticker('${escapeHTML(d)}')"><button class="remove-sticker-btn" onclick="removeSticker(event,${i})">✕</button></div>`);if(s.length<10)g.innerHTML+=`<div class="add-sticker-btn" onclick="document.getElementById('sticker-file-input').click()">+</div>`}
function removeSticker(e,i){e.stopPropagation();const s=getSavedStickers();s.splice(i,1);localStorage.setItem('retro_stickers',JSON.stringify(s));renderStickerDrawer();showToast('Removed')}
function handleStickerSelected(e){const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=ev=>{const img=new Image;img.src=ev.target.result;img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=150;c.getContext('2d').drawImage(img,0,0,150,150);const d=c.toDataURL('image/webp',.7),s=getSavedStickers();if(s.length>=10)return showToast('Full');s.push(d);localStorage.setItem('retro_stickers',JSON.stringify(s));renderStickerDrawer();showToast('Added')}};r.readAsDataURL(f)}
function toggleStickerSaveTooltip(e,id){e.stopPropagation();document.querySelectorAll('.add-to-pack-tooltip').forEach(t=>t.id!==id&&t.classList.remove('active'));document.getElementById(id).classList.toggle('active')}
function saveStickerToDrawer(e,d){e.stopPropagation();const s=getSavedStickers();if(s.includes(d))return showToast('Already added');if(s.length>=10)return showToast('Full');s.push(d);localStorage.setItem('retro_stickers',JSON.stringify(s));showToast('Added ✨');e.target.classList.remove('active')}
async function sendSticker(d){toggleStickerDrawer();await postMessagePayload(`[sticker]${d}`)}
document.onclick=()=>document.querySelectorAll('.add-to-pack-tooltip').forEach(t=>t.classList.remove('active'));

let mediaRecorder,audioChunks=[],recording=false;
async function toggleVoiceRecording(){const btn=document.getElementById('vn-btn');if(!recording){const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=()=>{const blob=new Blob(audioChunks,{type:'audio/webm'});const r=new FileReader;r.onload=()=>postMessagePayload(`[audio]${r.result}`);r.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};mediaRecorder.start();recording=true;btn.classList.add('recording')}else{mediaRecorder.stop();recording=false;btn.classList.remove('recording')}}

async function postMessagePayload(content){const data={sender:activeUser,receiver:targetUser,sender_username:activeUser,receiver_username:targetUser,content};socket.emit('send_message',data);const res=await fetch(`${API_BASE_URL}/api/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(res.ok){isUserScrolling=false;await loadChat();setTimeout(()=>chatContainer.scrollTop=chatContainer.scrollHeight,50)}}
function sanitizeMessageContent(c){if(!c)return'';let t=c.trim();const p=parseReplyContent(t);if(p)t=p.replySnippet;return t==='[sticker]'||t.includes('data:image/')?'[sticker]':t.startsWith('[img]')?'📷 Photo':t.startsWith('[audio]')?'🎙️ Voice note':t}
</script>
