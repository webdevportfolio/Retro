<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="nav-bar">
    <a href="index.html" class="nav-btn">← Back</a>
    <div id="chat-with-user" class="chat-header-title">user</div>
    <a href="profile.html" id="profile-btn" class="nav-btn">Profile</a>
  </header>

  <!-- Chat Messages Stream with explicit scroll behavior -->
  <main class="chat-container" id="chat-container" style="overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1;">
    <div id="messages-list" class="messages-list"></div>
  </main>

  <!-- Fixed Bottom Message Input Bar -->
  <footer class="chat-input-bar">
    <form id="chat-form" onsubmit="event.preventDefault(); sendMessage();">
      <input 
        type="text" 
        id="message-input" 
        class="input-field chat-field" 
        placeholder="Type a message..." 
        autocomplete="off"
        required
      >
      <button type="submit" class="send-btn">Send</button>
    </form>
  </footer>

  <script>
<script>
  const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';

  const rawActiveUser = localStorage.getItem('username') || localStorage.getItem('retro_session');
  const activeUser = rawActiveUser ? rawActiveUser.trim().replace('@', '') : '';
  
  const urlParams = new URLSearchParams(window.location.search);
  let targetUser = urlParams.get('user') || urlParams.get('username');
  if (targetUser) {
    targetUser = targetUser.trim().replace('@', '');
    // Mark conversation as read immediately when opened
    localStorage.setItem(`read_${targetUser.toLowerCase()}`, new Date().toISOString());
  }

  if (!activeUser) {
    window.location.href = 'auth.html';
  }

  if (!targetUser || targetUser === 'user' || targetUser.toLowerCase() === activeUser.toLowerCase()) {
    window.location.href = 'index.html';
  }

  document.getElementById('chat-with-user').textContent = targetUser;

  let isUserScrolling = false;
  const chatContainer = document.getElementById('chat-container');
  const messagesList = document.getElementById('messages-list');

  // Track manual scrolling
  chatContainer.addEventListener('scroll', () => {
    const isAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 50;
    isUserScrolling = !isAtBottom;
  });

  async function loadChat() {
    if (!activeUser || !targetUser) return;

    try {
      const response = await fetch(`${API_BASE_URL}/api/messages/${activeUser}`);
      if (!response.ok) return;

      const allMessages = await response.json();
      if (!messagesList) return;

      const messages = allMessages.filter(msg => {
        const sender = (msg.sender_username || msg.sender || '').trim().replace('@', '').toLowerCase();
        const receiver = (msg.receiver_username || msg.receiver || '').trim().replace('@', '').toLowerCase();
        const target = targetUser.toLowerCase();
        
        return sender === target || receiver === target;
      });

      if (!messages || messages.length === 0) {
        messagesList.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.4); margin-top:20px; font-size:0.85rem;">No messages yet. Say hi!</div>';
        return;
      }

      messagesList.innerHTML = messages.map(msg => {
        const senderRaw = msg.sender_username || msg.sender || '';
        const isSent = senderRaw.trim().replace('@', '').toLowerCase() === activeUser.toLowerCase();
        const time = new Date(msg.created_at || msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="message-wrapper ${isSent ? 'sent' : 'received'}">
            <div class="message-bubble">
              <div class="message-text">${msg.content}</div>
              <div class="message-meta">
                <span class="timer-clock">${time}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Delay scroll check slightly so DOM painted height is accurate
      if (!isUserScrolling) {
        setTimeout(() => {
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 50);
      }
      
    } catch (err) {
      console.error('Error fetching chat messages:', err);
    }
  }

  async function sendMessage() {
    const input = document.getElementById('message-input');
    const content = input.value.trim();

    if (!content || !targetUser || targetUser === 'user' || !activeUser) return;
    if (targetUser.toLowerCase() === activeUser.toLowerCase()) return;

    try {
      const response = await fetch(`${API_BASE_URL}/api/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sender: activeUser,
          receiver: targetUser,
          content: content
        })
      });

      if (response.ok) {
        input.value = '';
        isUserScrolling = false;
        await loadChat();
        setTimeout(() => {
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 50);
      } else {
        const errData = await response.json();
        console.error('Server rejected message:', errData);
      }
    } catch (err) {
      console.error('Error sending message:', err);
    }
  }

  loadChat();
  setInterval(loadChat, 3000);
</script>

</body>
</html>
