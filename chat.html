<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO - Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="nav-bar">
    <a href="index.html" class="nav-btn">← Back</a>
    <div id="chat-with-user" class="chat-header-title">username</div>
    <a href="profile.html" id="profile-btn" class="nav-btn">profile</a>
  </header>

  <!-- Chat Messages Stream -->
  <main class="chat-container">
    <div id="messages-list" class="messages-list">
      
      <!-- Received Message Bubble -->
      <div class="message-wrapper received">
        <div class="message-bubble">
          <p class="message-text">Yo, did you check out the new design drop?</p>
          <div class="message-meta">
            <span class="timer-clock" data-seconds="280">04:40</span>
          </div>
        </div>
      </div>

      <!-- Sent Message Bubble -->
      <div class="message-wrapper sent">
        <div class="message-bubble">
          <p class="message-text">Yeah man, it looks clean!</p>
          <div class="message-meta">
            <span class="timer-clock" data-seconds="295">04:55</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Fixed Bottom Message Input Bar -->
  <footer class="chat-input-bar">
    <form id="chat-form">
      <input 
        type="text" 
        id="message-input" 
        class="input-field chat-field" 
        placeholder="Type a message..." 
        autocomplete="off"
        required
      >
      <button type="submit" class="send-btn">Send</button>
    </form>
  </footer>

  <script>
  const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';

  // Get active session and URL params
  const activeUser = localStorage.getItem('retro_session');
  const urlParams = new URLSearchParams(window.location.search);
  const targetUser = urlParams.get('user');

  if (!activeUser) {
    window.location.href = 'auth.html';
  }

  if (targetUser) {
    document.getElementById('chat-with-user').textContent = `@${targetUser}`;
  }

  // Load chat messages between activeUser and targetUser
  async function loadChat() {
    if (!targetUser) return;

    try {
      const response = await fetch(`${API_BASE_URL}/api/messages/${activeUser}`);
      const messages = await response.json();

      if (!response.ok) return;

      // Filter messages specifically from the target user
      const chatFeed = document.getElementById('message-feed');
      const filteredMessages = messages.filter(msg => msg.sender_username === targetUser);

      if (filteredMessages.length === 0) {
        chatFeed.innerHTML = '<p style="color: #64748b; text-align: center;">No active messages. Send one below!</p>';
        return;
      }

      chatFeed.innerHTML = filteredMessages.map(msg => `
        <div class="message-bubble incoming">
          <p>${msg.content}</p>
        </div>
      `).join('');

    } catch (err) {
      console.error('Failed to load chat:', err);
    }
  }

  // Send message
  async function sendMessage() {
    const input = document.getElementById('message-input');
    const content = input.value.trim();

    if (!content || !targetUser) return;

    try {
      const response = await fetch(`${API_BASE_URL}/api/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sender_username: activeUser,
          receiver_username: targetUser,
          content: content,
          duration_minutes: 5 // Default 5 minutes timer
        })
      });

      if (response.ok) {
        input.value = '';
        loadChat(); // Refresh chat after sending
      }
    } catch (err) {
      console.error('Error sending message:', err);
    }
  }

  // Initial load & poll every 3 seconds for live updates
  loadChat();
  setInterval(loadChat, 3000);
</script>

</body>
</html>
