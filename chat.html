<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat</title>
  <link rel="stylesheet" href="chat.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#000000">
</head>
<body>

  <div class="chat-app-container">
    <!-- Top Navigation Header -->
    <header class="nav-bar">
      <a href="index.html" class="nav-btn">← Back</a>
      
      <div class="chat-header-user" onclick="openAvatarView()">
        <div class="chat-header-avatar-wrapper">
          <div class="chat-header-avatar" id="header-avatar-container">
            <img id="header-avatar-img" src="" alt="Avatar" style="display: none;">
            <span id="header-avatar-initial">?</span>
          </div>
        </div>
        <div class="chat-header-meta">
          <div class="chat-header-title-row">
            <span id="chat-with-user" class="chat-header-title">Loading...</span>
            <div class="online-dot" id="online-dot" style="display: none;" title="Active"></div>
          </div>
          <div id="typing-indicator" class="typing-indicator"></div>
        </div>
      </div>

      <!-- 3-Dots Profile Modal Toggle -->
      <button type="button" class="three-dots-btn" onclick="openAvatarView()" title="User Profile">⋮</button>
    </header>

    <!-- Chat Messages Stream -->
    <main class="chat-container" id="chat-container">
      <div id="messages-list" class="messages-list"></div>
    </main>

    <!-- Sticker Drawer Sheet -->
    <div id="sticker-drawer" class="sticker-drawer">
      <div class="sticker-drawer-header">
        <span>Your Stickers (<span id="sticker-count">0</span>/10)</span>
        <button type="button" class="close-reply-btn" onclick="toggleStickerDrawer()">✕</button>
      </div>
      <div class="sticker-grid" id="sticker-grid"></div>
    </div>

    <!-- Fixed Bottom Message Input Footer Bar -->
    <footer class="chat-input-bar">
      <div id="reply-preview-bar" class="reply-preview-bar" style="display: none;">
        <div>
          <div id="reply-user-label" class="reply-preview-user">Replying to</div>
          <div id="reply-text-label" class="reply-preview-content"></div>
        </div>
        <button type="button" class="close-reply-btn" onclick="cancelReply()">✕</button>
      </div>

      <!-- Hidden file inputs -->
      <input type="file" id="image-file-input" accept="image/*" style="display: none;" onchange="handleImageSelected(event)">
      <input type="file" id="sticker-file-input" accept="image/*" style="display: none;" onchange="handleStickerSelected(event)">

      <form id="chat-form">
        <div class="pill-input-container">
          <button type="button" id="gallery-btn" class="pill-btn" onclick="document.getElementById('image-file-input').click()" title="Send Image">
            📎
          </button>

          <button type="button" id="sticker-btn" class="pill-btn" onclick="toggleStickerDrawer()" title="Stickers">
            😀
          </button>
          
          <input 
            type="text" 
            id="message-input" 
            class="pill-input" 
            placeholder="Message..." 
            autocomplete="off"
          >

          <button type="button" id="vn-btn" class="pill-btn vn-btn" onclick="toggleVoiceRecording()" title="Record Voice Note">
            🎙️
          </button>

          <button type="submit" id="send-btn" class="circular-send-btn" title="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
          </button>
        </div>
      </form>
    </footer>
  </div>

  <!-- Image Preview & Lightbox Modal -->
  <div id="image-preview-modal" class="image-preview-modal" style="display: none;">
    <div class="image-preview-card">
      <div class="sheet-header">
        <div class="sheet-title" id="preview-modal-title">Preview Image</div>
        <button type="button" class="close-reply-btn" onclick="closeImagePreview()">✕</button>
      </div>
      <div class="image-preview-container">
        <img id="image-preview-elem" src="" alt="Selected Preview">
      </div>
      <div class="image-preview-actions" id="preview-modal-actions">
        <button type="button" class="nav-btn" onclick="closeImagePreview()">Cancel</button>
        <button type="button" id="image-send-btn" class="send-btn image-send-btn" onclick="sendSelectedImage()">Send Image</button>
      </div>
    </div>
  </div>

  <!-- Partner Profile Sheet -->
  <div id="partner-profile-sheet" class="partner-profile-sheet">
    <div class="partner-profile-card" id="partner-profile-card">
      <div class="sheet-header">
        <button type="button" class="nav-btn" onclick="closeAvatarView()">← Back</button>
        <div class="sheet-title">Profile</div>
        <div style="width: 32px;"></div>
      </div>

      <div class="sheet-avatar-wrapper">
        <div class="sheet-avatar">
          <img id="sheet-avatar-img" src="" alt="Profile Picture" style="display: none;">
          <span id="sheet-avatar-initial">?</span>
        </div>
      </div>

      <div id="sheet-username" class="sheet-username">User</div>

      <div class="sheet-code-container">
        <div class="sheet-code-label">PRIVATE CHAT CODE</div>
        <div class="sheet-code-box">
          <input type="text" id="sheet-chat-code" readonly value="Generating...">
          <button type="button" id="sheet-copy-btn" onclick="copyPartnerCode()">Copy Code</button>
        </div>
      </div>

      <button type="button" class="sheet-clear-btn" onclick="clearCurrentChat()">Clear Chat</button>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';

    let activeReplyTo = null;
    let isUserScrolling = false;
    let previousMessageCount = 0;
    let lastFetchedPfpUrl = null;

    const rawActiveUser = localStorage.getItem('username') || localStorage.getItem('retro_session') || '';
    const activeUser = rawActiveUser.trim().replace('@', '');
    
    const urlParams = new URLSearchParams(window.location.search);
    let targetUser = urlParams.get('user') || urlParams.get('username') || urlParams.get('u') || '';
    targetUser = targetUser.trim().replace('@', '');

    if (!activeUser) window.location.href = 'auth.html';
    if (!targetUser || targetUser.toLowerCase() === activeUser.toLowerCase()) window.location.href = 'index.html';

    const chatTitleElem = document.getElementById('chat-with-user');
    const avatarImg = document.getElementById('header-avatar-img');
    const avatarInitial = document.getElementById('header-avatar-initial');
    const chatContainer = document.getElementById('chat-container');
    const messagesList = document.getElementById('messages-list');
    const chatForm = document.getElementById('chat-form');

    if (chatTitleElem && targetUser) {
      chatTitleElem.textContent = targetUser;
      if (avatarInitial) avatarInitial.textContent = targetUser.charAt(0).toUpperCase();

      const cacheKey = `retro_pfp_${targetUser.toLowerCase()}`;
      const cachedUrl = localStorage.getItem(cacheKey);
      if (cachedUrl && avatarImg && avatarInitial) {
        avatarImg.src = cachedUrl;
        avatarImg.style.display = 'block';
        avatarInitial.style.display = 'none';
        lastFetchedPfpUrl = cachedUrl;
      }
      loadTargetUserProfile();
    }

    function applyAvatar(imgElem, initialElem, url, username) {
      if (!imgElem || !initialElem) return;
      if (url) {
        if (imgElem.src === url && imgElem.style.display === 'block') return;
        imgElem.onerror = function() {
          this.style.display = 'none';
          if (initialElem) {
            initialElem.style.display = 'block';
            initialElem.textContent = username ? username.charAt(0).toUpperCase() : '?';
          }
        };
        imgElem.src = url;
        imgElem.style.display = 'block';
        if (initialElem) initialElem.style.display = 'none';
      } else {
        imgElem.style.display = 'none';
        if (initialElem) {
          initialElem.style.display = 'block';
          initialElem.textContent = username ? username.charAt(0).toUpperCase() : '?';
        }
      }
    }

    async function loadTargetUserProfile() {
      if (!targetUser) return;
      try {
        let pfpUrl = null;
        const timestamp = Date.now();
        const userRes = await fetch(`${API_BASE_URL}/api/users/${encodeURIComponent(targetUser)}?t=${timestamp}`);
        if (userRes.ok) {
          const uData = await userRes.json();
          pfpUrl = uData.pfpUrl || uData.photoURL || uData.pfp || uData.avatar || uData.profile_picture || uData.profilePic || uData.image;
        }

        if (pfpUrl && pfpUrl !== lastFetchedPfpUrl) {
          lastFetchedPfpUrl = pfpUrl;
          applyAvatar(avatarImg, avatarInitial, pfpUrl, targetUser);
          const sheetImg = document.getElementById('sheet-avatar-img');
          const sheetInitial = document.getElementById('sheet-avatar-initial');
          applyAvatar(sheetImg, sheetInitial, pfpUrl, targetUser);
          localStorage.setItem(`retro_pfp_${targetUser.toLowerCase()}`, pfpUrl);
        }
      } catch (err) {
        console.error('Error fetching target avatar:', err);
      }
    }

    function openAvatarView() {
      const sheet = document.getElementById('partner-profile-sheet');
      const sheetImg = document.getElementById('sheet-avatar-img');
      const sheetInitial = document.getElementById('sheet-avatar-initial');
      const sheetUsername = document.getElementById('sheet-username');
      const sheetCodeInput = document.getElementById('sheet-chat-code');

      if (!sheet) return;
      if (sheetUsername) sheetUsername.textContent = targetUser;
      if (sheetCodeInput) sheetCodeInput.value = `RETRO-${Math.abs(targetUser.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a|0},0)).toString(36).toUpperCase().substring(0,5)}`;

      const cachedUrl = localStorage.getItem(`retro_pfp_${targetUser.toLowerCase()}`);
      applyAvatar(sheetImg, sheetInitial, cachedUrl, targetUser);
      sheet.classList.add('active');
    }

    function closeAvatarView() {
      const sheet = document.getElementById('partner-profile-sheet');
      if (sheet) sheet.classList.remove('active');
    }

    function formatSnippetText(content) {
      if (!content) return '';
      if (content.startsWith('[img]')) return '📷 Photo';
      if (content.startsWith('[sticker]')) return '🏷️ Sticker';
      if (content.startsWith('[audio]')) return '🎤 Voice note';
      return content;
    }

    async function loadChat() {
      if (!activeUser || !targetUser) return;
      try {
        const response = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}`);
        if (!response.ok) return;

        const allMessages = await response.json();
        if (!messagesList) return;

        const activeLower = activeUser.toLowerCase();
        const targetLower = targetUser.toLowerCase();

        const messages = allMessages
          .filter(msg => {
            const sender = (msg.sender_username || msg.sender || '').trim().replace('@', '').toLowerCase();
            const receiver = (msg.receiver_username || msg.receiver || '').trim().replace('@', '').toLowerCase();
            return (sender === activeLower && receiver === targetLower) || (sender === targetLower && receiver === activeLower);
          })
          .sort((a, b) => new Date(a.created_at || a.timestamp || 0) - new Date(b.created_at || b.timestamp || 0));

        if (!messages || messages.length === 0) {
          messagesList.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.4); margin-top:20px; font-size:0.85rem;">No messages yet. Say hi!</div>';
          return;
        }

        messagesList.innerHTML = messages.map(msg => {
          const senderRaw = msg.sender_username || msg.sender || '';
          const senderClean = senderRaw.trim().replace('@', '');
          const isSent = senderClean.toLowerCase() === activeLower;
          const time = new Date(msg.created_at || msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          let displayContent = msg.content || '';

          if (displayContent.startsWith('[img]')) {
            const base64Data = displayContent.substring(5);
            displayContent = `<img src="${base64Data}" class="msg-image" alt="Shared Image" onclick="openChatImageViewer('${base64Data}')">`;
          } else if (displayContent.startsWith('[sticker]')) {
            const base64Data = displayContent.substring(9);
            const stickerId = `stk_${Math.random().toString(36).substr(2, 9)}`;
            displayContent = `
              <div class="sticker-wrapper-container" onclick="toggleStickerSaveTooltip(event, '${stickerId}')">
                <img src="${base64Data}" class="msg-sticker" alt="Sticker">
                <div class="add-to-pack-tooltip" id="${stickerId}" onclick="saveStickerToDrawer(event, '${base64Data}')">Add to stickerpack</div>
              </div>
            `;
          }

          return `
            <div class="message-wrapper ${isSent ? 'sent' : 'received'}">
              <div class="message-bubble">
                <div class="message-text">${displayContent}</div>
                <div class="message-meta">
                  <span class="timer-clock">${time}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

        if (!isUserScrolling) {
          setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }
      } catch (err) {
        console.error('Error loading chat:', err);
      }
    }

    // --- STICKER DRAWER & MANAGEMENT ---
    function getSavedStickers() {
      return JSON.parse(localStorage.getItem('retro_stickers') || '[]');
    }

    function toggleStickerDrawer() {
      const drawer = document.getElementById('sticker-drawer');
      if (!drawer) return;
      drawer.classList.toggle('active');
      if (drawer.classList.contains('active')) renderStickerDrawer();
    }

    function renderStickerDrawer() {
      const grid = document.getElementById('sticker-grid');
      const stickers = getSavedStickers();
      const countElem = document.getElementById('sticker-count');
      if (countElem) countElem.textContent = stickers.length;
      if (!grid) return;

      grid.innerHTML = '';
      stickers.forEach((dataUrl, idx) => {
        const item = document.createElement('div');
        item.className = 'sticker-item';
        item.innerHTML = `<img src="${dataUrl}" alt="Sticker ${idx+1}">`;
        item.onclick = () => handleStickerPackClick(dataUrl, idx);
        grid.appendChild(item);
      });

      if (stickers.length < 10) {
        const addBtn = document.createElement('div');
        addBtn.className = 'add-sticker-btn';
        addBtn.textContent = '+';
        addBtn.onclick = () => document.getElementById('sticker-file-input').click();
        grid.appendChild(addBtn);
      }
    }

    function handleStickerPackClick(dataUrl, index) {
      const choice = confirm("Tap 'OK' to send this sticker, or 'Cancel' to remove it from your pack.");
      if (choice) {
        sendSticker(dataUrl);
      } else {
        if (confirm("Remove sticker from pack?")) {
          let stickers = getSavedStickers();
          stickers.splice(index, 1);
          localStorage.setItem('retro_stickers', JSON.stringify(stickers));
          renderStickerDrawer();
        }
      }
    }

    function toggleStickerSaveTooltip(event, stickerId) {
      event.stopPropagation();
      document.querySelectorAll('.add-to-pack-tooltip').forEach(tip => {
        if (tip.id !== stickerId) tip.classList.remove('active');
      });
      const tooltip = document.getElementById(stickerId);
      if (tooltip) tooltip.classList.toggle('active');
    }

    function saveStickerToDrawer(event, dataUrl) {
      event.stopPropagation();
      const stickers = getSavedStickers();
      if (stickers.includes(dataUrl)) return alert('Already in your pack!');
      if (stickers.length >= 10) return alert('Pack is full (max 10).');
      
      stickers.push(dataUrl);
      localStorage.setItem('retro_stickers', JSON.stringify(stickers));
      alert('Added to your stickerpack!');
      event.target.classList.remove('active');
    }

    async function sendSticker(dataUrl) {
      toggleStickerDrawer();
      await postMessagePayload(`[sticker]${dataUrl}`);
    }

    function handleStickerSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 150;
          canvas.height = 150;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 150, 150);
          const compressedBase64 = canvas.toDataURL('image/webp', 0.65);

          const stickers = getSavedStickers();
          if (stickers.length >= 10) return alert('Maximum 10 stickers allowed.');
          stickers.push(compressedBase64);
          localStorage.setItem('retro_stickers', JSON.stringify(stickers));
          renderStickerDrawer();
        };
      };
      reader.readAsDataURL(file);
    }

    // --- COMPRESSED IMAGE HANDLING ---
    function handleImageSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          const maxDim = 1000;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          selectedCompressedImage = canvas.toDataURL('image/jpeg', 0.65);
          
          document.getElementById('image-preview-elem').src = selectedCompressedImage;
          document.getElementById('preview-modal-actions').style.display = 'flex';
          document.getElementById('image-preview-modal').style.display = 'flex';
        };
      };
      reader.readAsDataURL(file);
    }

    async function sendSelectedImage() {
      if (!selectedCompressedImage) return;
      await postMessagePayload(`[img]${selectedCompressedImage}`);
      closeImagePreview();
    }

    function closeImagePreview() {
      document.getElementById('image-preview-modal').style.display = 'none';
      document.getElementById('image-file-input').value = '';
    }

    async function postMessagePayload(contentPayload) {
      try {
        await fetch(`${API_BASE_URL}/api/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sender: activeUser,
            receiver: targetUser,
            sender_username: activeUser,
            receiver_username: targetUser,
            content: contentPayload
          })
        });
        loadChat();
      } catch (err) {
        console.error('Payload error:', err);
      }
    }

    // --- TYPING & ONLINE STATUS ---
    async function checkPartnerTyping() {
      if (!targetUser) return;
      try {
        const res = await fetch(`${API_BASE_URL}/api/typing/${encodeURIComponent(targetUser)}/${encodeURIComponent(activeUser)}`);
        if (res.ok) {
          const data = await res.json();
          const indicator = document.getElementById('typing-indicator');
          if (indicator) indicator.textContent = data.isTyping ? `${targetUser} is typing...` : '';
        }
      } catch (err) { console.error(err); }
    }

    async function checkTargetOnlineStatus() {
      if (!targetUser) return;
      try {
        const res = await fetch(`${API_BASE_URL}/api/online-status/${encodeURIComponent(targetUser)}`);
        if (res.ok) {
          const data = await res.json();
          const dot = document.getElementById('online-dot');
          if (dot) dot.style.display = data.online ? 'block' : 'none';
        }
      } catch (err) { console.error(err); }
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.add-to-pack-tooltip').forEach(tip => tip.classList.remove('active'));
    });

    setInterval(checkPartnerTyping, 2000);
    setInterval(checkTargetOnlineStatus, 4000);
    setInterval(loadChat, 3000);
    loadChat();
    checkTargetOnlineStatus();
  </script>
</body>
</html>
