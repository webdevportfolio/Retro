<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Group Chat</title>
<link rel="stylesheet" href="groupchat.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#000">
<script src="theme.js"></script>
</head>
<body>

<div class="chat-app">

<header class="chat-header">
<button id="back-btn" class="header-btn">‹</button>

<div class="header-group">
<div id="header-avatar" class="header-avatar">G</div>
<div>
<div id="group-name" class="header-name">Group</div>
<div id="group-members" class="header-sub">Loading...</div>
</div>
</div>

<button id="menu-btn" class="header-btn">⋮</button>
</header>

<main id="messages" class="messages">
<div class="loading">Loading messages...</div>
</main>

<div id="image-preview-bar" class="image-preview-bar">
<img id="image-preview" src="" alt="">
<button id="remove-image">×</button>
</div>

<form id="message-form" class="message-form">
<label class="attach-btn">
+
<input id="image-input" type="file" accept="image/*">
</label>
<input id="message-input" type="text" placeholder="Message..." autocomplete="off" maxlength="2000">
<button id="send-btn" type="submit">➤</button>
</form>

</div>

<div id="menu-modal" class="overlay">
<div class="sheet">
<div class="sheet-title">GROUP</div>
<button id="members-btn" class="sheet-btn">Members</button>
<button id="add-member-btn" class="sheet-btn admin-only">Add member</button>
<button id="delete-group-btn" class="sheet-btn danger admin-only">Delete group</button>
<button id="leave-group-btn" class="sheet-btn danger">Leave group</button>
<button id="close-menu" class="sheet-btn cancel">Cancel</button>
</div>
</div>

<div id="members-modal" class="overlay">
<div class="sheet">
<div class="sheet-head">
<span>Members</span>
<button id="close-members">×</button>
</div>
<div id="members-list" class="members-list"></div>
</div>
</div>

<div id="add-modal" class="overlay">
<div class="sheet">
<div class="sheet-head">
<span>Add member</span>
<button id="close-add">×</button>
</div>
<div id="available-list" class="members-list"></div>
</div>
</div>

<div id="notice-modal" class="overlay">
<div class="notice">
<h3 id="notice-title">RETRO</h3>
<p id="notice-message"></p>
<button id="notice-ok">OK</button>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{

const API='https://retro-backend-hnsv.onrender.com';
const raw=localStorage.getItem('retro_session')||localStorage.getItem('username');

if(!raw){
location.href='auth.html';
return;
}

const username=raw.trim().replace(/^@/,'');
const groupId=new URLSearchParams(location.search).get('group');

if(!groupId){
location.href='groups.html';
return;
}

const messages=document.getElementById('messages');
const input=document.getElementById('message-input');
const imageInput=document.getElementById('image-input');
const imagePreview=document.getElementById('image-preview');
const imagePreviewBar=document.getElementById('image-preview-bar');

let group=null;
let members=[];
let selectedImage=null;

const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
}[c]));

const same=(a,b)=>(a||'').toLowerCase()===(b||'').toLowerCase();

function notice(message,title='RETRO'){
document.getElementById('notice-title').textContent=title;
document.getElementById('notice-message').textContent=message;
document.getElementById('notice-modal').classList.add('active');
}

document.getElementById('notice-ok').onclick=()=>{
document.getElementById('notice-modal').classList.remove('active');
};

document.getElementById('back-btn').onclick=()=>location.href='groups.html';

function avatarHTML(name,picture=''){
return picture
?`<img src="${esc(picture)}" alt="">`
:`<span>${esc((name||'G').charAt(0).toUpperCase())}</span>`;
}

async function loadGroup(){

try{

const r=await fetch(`${API}/api/groups/info/${encodeURIComponent(groupId)}`);
const d=await r.json();

if(!r.ok)throw Error(d.error||'Could not load group.');

group=d.group;
members=d.members||[];

if(!members.some(m=>same(m.username,username))){
location.href='groups.html';
return;
}

document.title=group.name||'Group';
document.getElementById('group-name').textContent=group.name||'Group';
document.getElementById('group-members').textContent=`${members.length} ${members.length===1?'member':'members'}`;
document.getElementById('header-avatar').innerHTML=avatarHTML(group.name,group.profile_picture);

const admin=same(group.admin_username,username);

document.querySelectorAll('.admin-only').forEach(el=>{
el.style.display=admin?'flex':'none';
});

await loadMessages();

}catch(e){

console.error(e);
notice(e.message||'Could not load group.');

}
}

async function loadMessages(){

try{

const r=await fetch(`${API}/api/groups/${encodeURIComponent(groupId)}/messages?username=${encodeURIComponent(username)}`);
const d=await r.json();

if(!r.ok)throw Error(d.error||'Could not load messages.');

const data=d.messages||[];

if(!data.length){
messages.innerHTML='<div class="empty-chat">No messages yet.<br>Start the conversation.</div>';
return;
}

messages.innerHTML=data.map(m=>{

const mine=same(m.sender_username,username);
const sender=m.sender_username||'User';

return`
<div class="message-row ${mine?'mine':''}">
${!mine?`<div class="message-avatar">${esc(sender.charAt(0).toUpperCase())}</div>`:''}
<div class="message-bubble">
${!mine?`<div class="sender">${esc(sender)}</div>`:''}
${m.image_url?`<img class="message-image" src="${esc(m.image_url)}" alt="Image">`:''}
${m.content?`<div class="message-text">${esc(m.content)}</div>`:''}
<div class="message-time">${formatTime(m.created_at)}</div>
</div>
</div>`;
}).join('');

messages.scrollTop=messages.scrollHeight;

}catch(e){

messages.innerHTML='<div class="empty-chat">Could not load messages.</div>';

}
}

function formatTime(value){

if(!value)return'';

const d=new Date(value);

return d.toLocaleTimeString([],{
hour:'numeric',
minute:'2-digit'
});
}

imageInput.onchange=()=>{

const file=imageInput.files[0];

if(!file)return;

if(file.size>8*1024*1024){
imageInput.value='';
notice('Image must be smaller than 8MB.');
return;
}

const reader=new FileReader();

reader.onload=()=>{
selectedImage=reader.result;
imagePreview.src=selectedImage;
imagePreviewBar.classList.add('show');
};

reader.readAsDataURL(file);
};

document.getElementById('remove-image').onclick=()=>{
selectedImage=null;
imageInput.value='';
imagePreview.src='';
imagePreviewBar.classList.remove('show');
};

document.getElementById('message-form').onsubmit=async e=>{

e.preventDefault();

const content=input.value.trim();

if(!content&&!selectedImage)return;

const btn=document.getElementById('send-btn');

btn.disabled=true;

try{

const r=await fetch(`${API}/api/groups/${encodeURIComponent(groupId)}/messages`,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
sender_username:username,
content,
image_url:selectedImage
})
});

const d=await r.json();

if(!r.ok)throw Error(d.error||'Could not send message.');

input.value='';
selectedImage=null;
imageInput.value='';
imagePreview.src='';
imagePreviewBar.classList.remove('show');

await loadMessages();

}catch(e){

notice(e.message||'Could not send message.');

}finally{

btn.disabled=false;
input.focus();

}
};

document.getElementById('menu-btn').onclick=()=>{
document.getElementById('menu-modal').classList.add('active');
};

document.getElementById('close-menu').onclick=()=>{
document.getElementById('menu-modal').classList.remove('active');
};

document.getElementById('members-btn').onclick=async()=>{
document.getElementById('menu-modal').classList.remove('active');
await loadMembers();
document.getElementById('members-modal').classList.add('active');
};

document.getElementById('close-members').onclick=()=>{
document.getElementById('members-modal').classList.remove('active');
};

async function loadMembers(){

const list=document.getElementById('members-list');

list.innerHTML='<div class="loading">Loading members...</div>';

try{

const r=await fetch(`${API}/api/groups/info/${encodeURIComponent(groupId)}`);
const d=await r.json();

if(!r.ok)throw Error(d.error||'Could not load members.');

members=d.members||[];
group=d.group;

const admin=same(group.admin_username,username);

list.innerHTML=members.map(m=>{

const isAdmin=same(m.username,group.admin_username);
const canRemove=admin&&!isAdmin&&!same(m.username,username);

return`
<div class="member-row">
<div class="member-avatar">${esc(m.username.charAt(0).toUpperCase())}</div>
<div class="member-details">
<div>${esc(m.username)}</div>
<div class="member-role">${isAdmin?'Admin':'Member'}</div>
</div>
${canRemove?`<button class="remove-member" data-user="${esc(m.username)}">Remove</button>`:''}
</div>`;

}).join('');

list.querySelectorAll('.remove-member').forEach(btn=>{
btn.onclick=()=>removeMember(btn.dataset.user);
});

document.getElementById('group-members').textContent=`${members.length} ${members.length===1?'member':'members'}`;

}catch(e){

list.innerHTML='<div class="loading">Could not load members.</div>';

}
}

document.getElementById('add-member-btn').onclick=async()=>{
document.getElementById('menu-modal').classList.remove('active');
await loadAvailableMembers();
document.getElementById('add-modal').classList.add('active');
};

document.getElementById('close-add').onclick=()=>{
document.getElementById('add-modal').classList.remove('active');
};

async function loadAvailableMembers(){

const list=document.getElementById('available-list');

list.innerHTML='<div class="loading">Loading contacts...</div>';

try{

const r=await fetch(`${API}/api/groups/${encodeURIComponent(groupId)}/available-members/${encodeURIComponent(username)}`);
const d=await r.json();

if(!r.ok)throw Error(d.error||'Could not load contacts.');

const users=d.users||[];

if(!users.length){
list.innerHTML='<div class="loading">No available DM contacts.</div>';
return;
}

list.innerHTML=users.map(user=>`
<button class="available-member" data-user="${esc(user)}">
<div class="member-avatar">${esc(user.charAt(0).toUpperCase())}</div>
<span>${esc(user)}</span>
<span class="add-symbol">+</span>
</button>
`).join('');

list.querySelectorAll('.available-member').forEach(btn=>{
btn.onclick=()=>addMember(btn.dataset.user);
});

}catch(e){

list.innerHTML='<div class="loading">Could not load contacts.</div>';

}
}

async function addMember(member){

try{

const r=await fetch(`${API}/api/groups/${encodeURIComponent(groupId)}/members`,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
admin_username:username,
member_username:member
})
});

const d=await r.json();

if(!r.ok)throw Error(d.error||'Could not add member.');

document.getElementById('add-modal').classList.remove('active');

await loadGroup();

notice(`${member} was added to the group.`);

}catch(e){

notice(e.message||'Could not add member.');

}
}

async function removeMember(member){

if(!confirm(`Remove ${member} from this group?`))return;

try{

const r=await fetch(`${API}/api/groups/${encodeURIComponent(groupId)}/members/${encodeURIComponent(member)}`,{
method:'DELETE',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
admin_username:username
})
});

const d=await r.json();

if(!r.ok)throw Error(d.error||'Could not remove member.');

await loadGroup();
await loadMembers();

}catch(e){

notice(e.message||'Could not remove member.');

}
}

document.getElementById('delete-group-btn').onclick=async()=>{

if(!confirm('Delete this group permanently?'))return;

try{

const r=await fetch(`${API}/api/groups/${encodeURIComponent(groupId)}`,{
method:'DELETE',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({username})
});

const d=await r.json();

if(!r.ok)throw Error(d.error||'Could not delete group.');

location.href='groups.html';

}catch(e){

notice(e.message||'Could not delete group.');

}
};

document.getElementById('leave-group-btn').onclick=async()=>{

if(same(group?.admin_username,username)){
notice('The admin cannot leave the group. Delete the group instead.');
return;
}

if(!confirm('Leave this group?'))return;

try{

const r=await fetch(`${API}/api/groups/${encodeURIComponent(groupId)}/leave`,{
method:'DELETE',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({username})
});

const d=await r.json();

if(!r.ok)throw Error(d.error||'Could not leave group.');

location.href='groups.html';

}catch(e){

notice(e.message||'Could not leave group.');

}
};

loadGroup();

setInterval(()=>{
if(document.visibilityState==='visible')loadMessages();
},3000);

});
</script>

</body>
</html>
