<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Chat</title>
  <link rel="stylesheet" href="groupchat.css">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#000000">
</head>
<body>

  <!-- Top Bar -->
  <header class="nav-bar">
    <a href="index.html" class="nav-btn">← Back</a>
    
    <!-- Tapping header opens group settings -->
    <div class="chat-header-group" onclick="toggleSettingsDrawer(true)">
      <div class="chat-header-avatar" id="header-gc-avatar">👥</div>
      <div>
        <div class="chat-header-title" id="header-gc-name">Loading...</div>
        <div class="group-members-count" id="header-gc-count">0 members</div>
      </div>
    </div>

    <div style="width: 40px;"></div>
  </header>

  <!-- Message Feed -->
  <main class="chat-container">
    <div class="messages-list">
      <!-- Dynamically populated via script -->
    </div>
  </main>

  <!-- Bottom Input Bar -->
  <footer class="chat-input-bar">
    <form action="javascript:void(0);">
      <input type="text" class="input-field" placeholder="Type a message..." autocomplete="off">
      <button type="button" class="send-btn" onclick="sendMessage()">Send</button>
    </form>
  </footer>

  <!-- Group Settings Side Drawer -->
  <div class="modal-overlay" id="settings-drawer" onclick="if(event.target === this) toggleSettingsDrawer(false)">
    <div class="drawer-content">
      <div class="drawer-header">
        <h2 class="drawer-title">Group Details</h2>
        <button class="close-btn" onclick="toggleSettingsDrawer(false)">&times;</button>
      </div>

      <!-- Change Profile Picture -->
      <div class="pfp-upload-section">
        <div class="pfp-preview-container" id="drawer-gc-avatar">👥</div>
        <label for="group-pfp-input" class="change-pfp-btn">Change Group Icon</label>
        <input type="file" id="group-pfp-input" accept="image/*" style="display: none;" onchange="handlePfpChange(event)">
      </div>

      <!-- Group Name Display/Edit -->
      <div style="margin-bottom: 24px;">
        <div class="section-label">Group Name</div>
        <input type="text" id="drawer-gc-name-input" class="input-field" style="width: 100%;">
      </div>

      <!-- Members List Section -->
      <div>
        <div class="section-label">Members (<span id="drawer-members-count">0</span>)</div>
        <div class="members-list" id="drawer-members-list">
          <!-- Dynamically populated via script -->
        </div>
      </div>

      <button class="danger-btn" onclick="leaveGroup()">Leave Group</button>
    </div>
  </div>

  <script>
  const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';
  const activeUser = (localStorage.getItem('username') || localStorage.getItem('retro_session') || '').trim().replace('@', '');
  const urlParams = new URLSearchParams(window.location.search);
  const groupId = urlParams.get('id');

  let currentGroupData = null;
  let lastMessageCount = 0;

  window.addEventListener('DOMContentLoaded', () => {
    if (!activeUser) {
      window.location.href = 'auth.html';
      return;
    }
    if (!groupId) {
      window.location.href = 'index.html';
      return;
    }

    loadGroupDetails();
    loadMessages();

    // Poll for new messages every 3 seconds
    setInterval(loadMessages, 3000);

    // Form submit listener
    const form = document.querySelector('.chat-input-bar form');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        sendMessage();
      });
    }
  });

  async function loadGroupDetails() {
    try {
      const res = await fetch(`${API_BASE_URL}/api/groups/${groupId}`);
      if (!res.ok) return;

      currentGroupData = await res.json();
      renderGroupHeader(currentGroupData);
      renderDrawerMembers(currentGroupData);
    } catch (err) {
      console.error('Failed to load group details:', err);
    }
  }

  function renderGroupHeader(group) {
    const titleEl = document.getElementById('header-gc-name');
    const countEl = document.getElementById('header-gc-count');
    if (titleEl) titleEl.textContent = group.name;
    if (countEl) countEl.textContent = `${group.members ? group.members.length : 0} members`;
  }

  async function loadMessages() {
    try {
      const res = await fetch(`${API_BASE_URL}/api/groups/${groupId}/messages`);
      if (!res.ok) return;

      const messages = await res.json();
      if (messages.length === lastMessageCount && lastMessageCount !== 0) return;

      lastMessageCount = messages.length;
      renderMessages(messages);
    } catch (err) {
      console.error('Failed to load messages:', err);
    }
  }

  function renderMessages(messages) {
    const container = document.querySelector('.messages-list');
    if (!container) return;

    if (!messages || messages.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; color: rgba(255,255,255,0.4); padding: 40px 20px; font-size: 0.85rem;">
          No messages here yet. Say hello to start the chat!
        </div>
      `;
      return;
    }

    container.innerHTML = messages.map(msg => {
      const sender = (msg.sender || '').trim().replace('@', '');
      const isSent = sender.toLowerCase() === activeUser.toLowerCase();
      const time = new Date(msg.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      return `
        <div class="message-wrapper ${isSent ? 'sent' : 'received'}">
          <div class="message-bubble">
            ${!isSent ? `<div class="group-sender-name">${sender}</div>` : ''}
            <div class="message-text">${escapeHtml(msg.content)}</div>
            <div class="message-meta">
              <span class="timer-clock">${time}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Scroll to bottom
    const chatContainer = document.querySelector('.chat-container');
    if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  async function sendMessage() {
    const input = document.querySelector('.chat-input-bar .input-field');
    const content = input.value.trim();
    if (!content) return;

    input.value = '';

    try {
      const res = await fetch(`${API_BASE_URL}/api/groups/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          group_id: groupId,
          sender: activeUser,
          content: content
        })
      });

      if (res.ok) {
        loadMessages();
      }
    } catch (err) {
      console.error('Failed to send message:', err);
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function toggleSettingsDrawer(open) {
    const drawer = document.getElementById('settings-drawer');
    if (open) {
      drawer.classList.add('active');
      if (groupId) loadGroupDetails();
    } else {
      drawer.classList.remove('active');
    }
  }

  function renderDrawerMembers(group) {
    const membersList = document.getElementById('drawer-members-list');
    const membersCount = document.getElementById('drawer-members-count');
    const nameInput = document.getElementById('drawer-gc-name-input');
    
    if (nameInput) nameInput.value = group.name;
    if (membersCount) membersCount.textContent = group.members ? group.members.length : 0;

    const isAdmin = (group.created_by || '').toLowerCase() === activeUser.toLowerCase();

    if (!group.members) return;

    membersList.innerHTML = group.members.map(member => {
      const cleanName = member.trim().replace('@', '');
      const isSelf = cleanName.toLowerCase() === activeUser.toLowerCase();
      const isCreator = cleanName.toLowerCase() === (group.created_by || '').toLowerCase();

      return `
        <div class="member-item">
          <div class="member-info">
            <div class="member-avatar">${cleanName.charAt(0).toUpperCase()}</div>
            <div class="member-name">${cleanName}</div>
            ${isCreator ? '<span class="admin-badge">Admin</span>' : ''}
          </div>
          ${(isAdmin && !isSelf && !isCreator) 
            ? `<button class="remove-member-btn" onclick="removeMember('${cleanName}')">Remove</button>` 
            : ''
          }
        </div>
      `;
    }).join('');
  }

  async function removeMember(targetUsername) {
    if (!confirm(`Are you sure you want to remove ${targetUsername} from the group?`)) return;

    try {
      const updatedMembers = currentGroupData.members.filter(
        m => m.trim().replace('@', '').toLowerCase() !== targetUsername.toLowerCase()
      );

      const res = await fetch(`${API_BASE_URL}/api/groups/${groupId}/members`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ members: updatedMembers })
      });

      if (res.ok) {
        currentGroupData.members = updatedMembers;
        renderDrawerMembers(currentGroupData);
        renderGroupHeader(currentGroupData);
      }
    } catch (err) {
      console.error('Failed to remove member:', err);
    }
  }

  function handlePfpChange(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const imageSrc = e.target.result;
      document.getElementById('header-gc-avatar').innerHTML = `<img src="${imageSrc}" alt="Group Avatar">`;
      document.getElementById('drawer-gc-avatar').innerHTML = `<img src="${imageSrc}" alt="Group Avatar">`;
    };
    reader.readAsDataURL(file);
  }

  function leaveGroup() {
    if (confirm('Are you sure you want to leave this group?')) {
      window.location.href = 'index.html';
    }
  }
</script>

</body>
</html>
