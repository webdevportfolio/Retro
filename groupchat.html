<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Group Chat</title>
  <link rel="stylesheet" href="groupchat.css">
    <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#000000">

</head>
<body>

  <!-- Navigation Bar -->
  <header class="nav-bar">
    <div class="chat-header-group" onclick="toggleSettingsDrawer(true)">
      <div class="chat-header-avatar" id="header-avatar">G</div>
      <div>
        <div class="chat-header-title" id="header-group-name">Loading Group...</div>
        <div class="group-members-count" id="header-group-members">0 members</div>
      </div>
    </div>
    <a href="index.html" class="nav-btn">Back</a>
  </header>

  <!-- Scrollable Stream Container -->
  <div class="chat-container">
    <div class="messages-list" id="chat-container">
      <!-- Messages populated dynamically -->
    </div>
  </div>

  <!-- Input Bar -->
  <div class="chat-input-bar">
    <form onsubmit="event.preventDefault(); sendMessage();">
      <input type="text" id="message-input" class="input-field" placeholder="Type a message..." autocomplete="off">
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>

  <!-- Group Settings Modal/Drawer -->
  <div class="modal-overlay" id="settings-drawer-overlay" onclick="if(event.target === this) toggleSettingsDrawer(false)">
    <div class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title">Group Settings</div>
        <button class="close-btn" onclick="toggleSettingsDrawer(false)">&times;</button>
      </div>

      <!-- Add Members Section -->
      <div style="margin-bottom: 24px;">
        <div class="section-label">Add Members from DMs</div>
        <div id="drawer-dm-selection" style="max-height: 140px; overflow-y: auto; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px;">
          <div style="font-size: 0.8rem; color: rgba(255,255,255,0.4);">Loading contacts...</div>
        </div>
        <button class="nav-btn" style="width: 100%; text-align: center; border-color: var(--accent-purple); color: var(--accent-purple);" onclick="addSelectedMembers()">Add Selected</button>
        <div id="add-member-error" style="font-size: 0.75rem; color: var(--danger-red); margin-top: 6px; display: none;"></div>
      </div>

      <div class="section-label">Current Members</div>
      <div class="members-list" id="drawer-members-list">
        <!-- Members populated dynamically -->
      </div>

      <button class="danger-btn" onclick="leaveOrDeleteGroup()">Leave Group</button>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://retro-backend-hnsv.onrender.com';
    const urlParams = new URLSearchParams(window.location.search);
    const groupId = urlParams.get('id');
    const activeUser = localStorage.getItem('retro_username') || 'Anonymous';

    let currentGroupData = null;

    window.addEventListener('DOMContentLoaded', () => {
      if (!groupId) {
        window.location.href = 'index.html';
        return;
      }
      fetchGroupDetails();
      setInterval(fetchGroupDetails, 4000); // Polling for sync
    });

    async function fetchGroupDetails() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/groups/${groupId}`);
        if (!res.ok) return;
        currentGroupData = await res.json();
        
        renderGroupHeader(currentGroupData);
        renderDrawerMembers(currentGroupData);
        renderMessages(currentGroupData.messages || []);
      } catch (err) {
        console.error('Failed to fetch group details:', err);
      }
    }

    function renderGroupHeader(group) {
      document.getElementById('header-group-name').textContent = group.name;
      document.getElementById('header-group-members').textContent = `${group.members.length} members`;
      document.getElementById('header-avatar').textContent = group.name.charAt(0).toUpperCase();
    }

    function renderDrawerMembers(group) {
      const container = document.getElementById('drawer-members-list');
      container.innerHTML = group.members.map(member => `
        <div class="member-item">
          <div class="member-info">
            <div class="member-avatar">${member.charAt(0).toUpperCase()}</div>
            <div class="member-name">${member}</div>
          </div>
          ${member === group.created_by ? '<span class="admin-badge">Admin</span>' : ''}
        </div>
      `).join('');
    }

    function renderMessages(messages) {
      const container = document.getElementById('chat-container');
      const isScrolledToBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;

      container.innerHTML = messages.map(msg => {
        const senderName = msg.sender_username || msg.sender || 'Anonymous';
        const isOutgoing = senderName === activeUser;
        const msgText = msg.text || msg.content || '';
        
        return `
          <div class="message-wrapper ${isOutgoing ? 'sent' : 'received'}">
            <div class="message-bubble">
              ${!isOutgoing ? `<div class="group-sender-name">${senderName}</div>` : ''}
              <div class="message-text">${msgText}</div>
            </div>
          </div>
        `;
      }).join('');

      if (isScrolledToBottom) {
        container.scrollTop = container.scrollHeight;
      }
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      try {
        const res = await fetch(`${API_BASE_URL}/api/groups/${groupId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender: activeUser, content: text })
        });

        if (res.ok) {
          input.value = '';
          fetchGroupDetails();
        }
      } catch (err) {
        console.error('Failed to send message:', err);
      }
    }

    function toggleSettingsDrawer(open) {
      const drawerOverlay = document.getElementById('settings-drawer-overlay');
      if (open) {
        drawerOverlay.classList.add('active');
        loadDrawerDmContacts();
      } else {
        drawerOverlay.classList.remove('active');
      }
    }

    async function loadDrawerDmContacts() {
      const container = document.getElementById('drawer-dm-selection');
      if (!container || !currentGroupData) return;

      const lowerActive = activeUser.toLowerCase();
      try {
        const res = await fetch(`${API_BASE_URL}/api/messages/${encodeURIComponent(activeUser)}`);
        if (!res.ok) return;
        const messages = await res.json();
        const contactsSet = new Set();

        messages.forEach(msg => {
          const sender = (msg.sender_username || msg.sender || '').trim().replace('@', '');
          const receiver = (msg.receiver_username || msg.receiver || '').trim().replace('@', '');
          if (sender && sender.toLowerCase() !== lowerActive) contactsSet.add(sender);
          if (receiver && receiver.toLowerCase() !== lowerActive) contactsSet.add(receiver);
        });

        const existingMembers = new Set(currentGroupData.members.map(m => m.trim().replace('@', '').toLowerCase()));
        const availableContacts = Array.from(contactsSet).filter(c => !existingMembers.has(c.toLowerCase()));

        if (availableContacts.length === 0) {
          container.innerHTML = `<div style="font-size: 0.8rem; color: rgba(255,255,255,0.4);">No new contacts available.</div>`;
          return;
        }

        container.innerHTML = availableContacts.map(username => `
          <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; padding: 2px 0;">
            <input type="checkbox" class="drawer-member-checkbox" value="${username}" style="accent-color: var(--accent-purple);">
            <span>${username}</span>
          </label>
        `).join('');
      } catch (err) {
        console.error('Failed to load contacts for drawer:', err);
      }
    }

    async function addSelectedMembers() {
      const checkedBoxes = document.querySelectorAll('.drawer-member-checkbox:checked');
      const newMembers = Array.from(checkedBoxes).map(cb => cb.value);
      const errorEl = document.getElementById('add-member-error');
      
      if (errorEl) errorEl.style.display = 'none';
      if (newMembers.length === 0) return;

      try {
        const updatedMembers = [...currentGroupData.members, ...newMembers];
        const res = await fetch(`${API_BASE_URL}/api/groups/${groupId}/members`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ members: updatedMembers, requested_by: activeUser })
        });

        if (res.ok) {
          currentGroupData.members = updatedMembers;
          renderDrawerMembers(currentGroupData);
          renderGroupHeader(currentGroupData);
          loadDrawerDmContacts();
        } else {
          const errData = await res.json();
          if (errorEl) {
            errorEl.textContent = errData.error || 'Failed to add members.';
            errorEl.style.display = 'block';
          }
        }
      } catch (err) {
        console.error('Network error adding members:', err);
      }
    }

    async function leaveOrDeleteGroup() {
      if (!confirm('Are you sure you want to leave this group?')) return;
      try {
        const updatedMembers = currentGroupData.members.filter(m => m !== activeUser);
        const res = await fetch(`${API_BASE_URL}/api/groups/${groupId}/members`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ members: updatedMembers, requested_by: activeUser })
        });
        if (res.ok) {
          window.location.href = 'index.html';
        }
      } catch (err) {
        console.error('Failed to leave group:', err);
      }
    }
  </script>
</body>
</html>
